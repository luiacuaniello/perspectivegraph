name: PerspectiveGraph attack-path gate
description: >-
  Fail a pull request when the change puts a sensitive asset within reach - blocking on
  attack paths rather than on vulnerability counts, and telling you when nobody looked.
author: luiacuaniello
branding:
  icon: git-merge
  color: red

# What this is for, and what it is not for.
#
# Every scanner already in your pipeline blocks on severity: a critical CVE fails the
# build wherever it sits. Most of those criticals cannot be reached from the internet, and
# some of the mediums can - so severity gates cost you time on the ones that do not matter
# and stay quiet on the ones that do. This gate answers a different question: after this
# change, is there a route from something exposed to something that matters?
#
# Answering it needs an estate, which is why this action talks to a running
# PerspectiveGraph rather than analysing the repository in the runner. Point it at yours.
#
# It has THREE outcomes, and the third is the reason it exists. A pipeline whose scanner
# output never arrived gets the same green light as one that is genuinely clean, from
# every two-state gate ever written. Here that is UNKNOWN, and it fails the build by
# default - see the allow-unknown input.
#
# Runners: Linux and macOS, on amd64 or arm64. The release also ships a Windows binary,
# but these steps assume POSIX tooling throughout, so a Windows runner is refused with a
# message that says so rather than left to fail somewhere further down.

inputs:
  report:
    description: >-
      Scanner report to ingest (Trivy JSON, Semgrep JSON, ...). Leave empty to only wait
      for a verdict, for pipelines where something else already ingested this commit.
    required: false
    default: ""
  source:
    description: 'Collector that parses the report, i.e. the /ingest/{source} route: trivy, semgrep, ...'
    required: false
    default: trivy
  mode:
    description: >-
      "server" (default) sends the report to a running PerspectiveGraph and waits for its
      verdict. "local" needs no deployment at all: the runner reads your estate read-only,
      ingests this pull request's scan, and computes the verdict in-process with the same
      engine. Local mode still needs an estate - `aws-region` or `estate` - because
      without one there are no attack paths, only a flat list of findings.
    required: false
    default: server
  api:
    description: Base URL of the PerspectiveGraph API. Required in server mode, unused in local mode.
    required: false
    default: ""
  ingest:
    description: Base URL of the ingest webhook. Server mode only, and only when a report is given.
    required: false
    default: ""
  aws-region:
    description: >-
      Local mode: read the estate live from this AWS region. Read-only - it describes
      resources and writes nothing. Give the job an OIDC role with SecurityAudit.
    required: false
    default: ""
  aws-role:
    description: "Local mode: cross-account read-only role to assume for aws-region."
    required: false
    default: ""
  estate:
    description: >-
      Local mode: the estate as an events JSON file, the format `perspectivegraph
      awscollect -json` writes. An alternative to aws-region for pipelines that collect
      the estate on their own schedule rather than on every pull request.
    required: false
    default: ""
  reports:
    description: >-
      Local mode: additional scanner reports, one `source=path` per line (e.g.
      "semgrep=semgrep.json"). With no server accumulating scans, whatever this run is
      given is the whole picture.
    required: false
    default: ""
  token:
    description: >-
      Bearer token for the API, if auth is on. Server mode only. Pass a secret, never a
      literal.
    required: false
    default: ""
  hmac-secret:
    description: >-
      Server mode only: shared secret signing the ingest body, if the webhook requires it.
      Local mode posts to no webhook, so it needs no secret.
    required: false
    default: ""
  slug:
    description: Repository as "owner/name". Defaults to the one running the workflow.
    required: false
    default: ${{ github.repository }}
  sha:
    description: >-
      Commit under test. Defaults to the pull request's head SHA, which is the commit a
      reviewer is looking at - github.sha on a pull_request event is the merge commit, and
      no scanner stamps that one.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  pr:
    description: Pull-request number, so findings can be commented back onto it.
    required: false
    default: ${{ github.event.pull_request.number || 0 }}
  max-critical:
    description: Fail when the commit sits on more than this many critical attack paths.
    required: false
    default: "0"
  timeout:
    description: >-
      Server mode only: how long to wait for the engine to analyse this commit before
      reporting UNKNOWN. Must comfortably exceed your ANALYZER_INTERVAL. Local mode
      computes the verdict in one pass, so it never waits.
    required: false
    default: 5m
  allow-unknown:
    description: >-
      Pass the build when the commit was never analysed. This turns off the one thing this
      action does that your other scanners do not, so a broken ingest becomes a green
      check. Reasonable while you are rolling the gate out; a liability afterwards.
    required: false
    default: "false"
  binary:
    description: >-
      Path to a perspectivegraph binary that already exists on the runner. Skips the
      download and the signature check, because there is nothing downloaded to verify.
      For air-gapped runners, and for testing a build that has not been released yet -
      without it, this action can only ever be exercised against the previous release,
      which makes any change to it untestable until after it ships.
    required: false
    default: ""
  version:
    description: Release tag of the gate binary to run. "latest" tracks the newest release.
    required: false
    default: latest
  verify:
    description: >-
      Verify the downloaded binary's cosign signature and checksum before running it. Off
      means executing an unverified download in your CI, with your ingest secret.
    required: false
    default: "true"

  soft-fail:
    description: >-
      Always succeed, and report the verdict through the outputs instead of through a red
      check. Use it when a later step decides what to do - comment on the PR, open a
      ticket, block only on some branches. The outputs are set either way, so this changes
      whether the build stops, not what you can read.
    required: false
    default: "false"

# Set on every run, including a red one - a later step can always read what was decided,
# whether or not it also stopped the build.
outputs:
  verdict:
    description: One of clean, blocked or unknown.
    value: ${{ steps.gate.outputs.verdict }}
  critical-paths:
    description: How many critical attack paths run through this commit.
    value: ${{ steps.gate.outputs.critical-paths }}
  exit-code:
    description: "0 clean, 1 blocked, 2 unknown, 3 error."
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install cosign
      if: inputs.verify == 'true' && inputs.binary == ''
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download the gate binary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERIFY: ${{ inputs.verify }}
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        # Not ${RUNNER_TEMP}/perspectivegraph: that is where a workflow building the
        # binary itself would naturally put it, and `mkdir -p` over an existing FILE
        # fails - killing this step before it produces anything, which reads as an
        # action that ran and reported nothing.
        dir="${RUNNER_TEMP}/perspectivegraph-gate"
        mkdir -p "$dir"

        # A binary supplied by the caller replaces the download entirely - there is
        # nothing fetched, so there is nothing to verify. It is copied rather than used
        # in place so the probe and the run below take the same path in both cases.
        if [ -n "$BINARY" ]; then
          if [ ! -x "$BINARY" ]; then
            echo "::error::binary '${BINARY}' does not exist or is not executable"
            exit 1
          fi
          cp "$BINARY" "${dir}/perspectivegraph"
        else
          base="https://github.com/luiacuaniello/perspectivegraph/releases"
          if [ "$VERSION" = "latest" ]; then
            base="${base}/latest/download"
          else
            base="${base}/download/${VERSION}"
          fi

          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture ${arch}"; exit 1 ;;
          esac

          # The archive used to be hardcoded to linux, so a macOS runner downloaded a
          # Linux binary and then failed at the probe with "this release has no gate
          # subcommand" - blaming the release for what was a platform mismatch, and
          # sending whoever read it hunting for a bug that did not exist.
          case "$(uname -s)" in
            Linux)  os=linux ;;
            Darwin) os=darwin ;;
            *)
              echo "::error::unsupported runner OS $(uname -s). This action needs a Linux or macOS runner; the release ships a Windows binary but this action's steps assume POSIX tooling."
              exit 1
              ;;
          esac
          archive="perspectivegraph_${os}_${arch}.tar.gz"

          curl --fail --silent --show-error --location --retry 3 \
            -o "${dir}/${archive}" "${base}/${archive}"

          if [ "$VERIFY" = "true" ]; then
            curl --fail --silent --show-error --location --retry 3 \
              -o "${dir}/SHA256SUMS" "${base}/SHA256SUMS"
            curl --fail --silent --show-error --location --retry 3 \
              -o "${dir}/SHA256SUMS.bundle" "${base}/SHA256SUMS.bundle"

            # The signature covers the checksum file, which covers every archive - so one
            # signature check plus one checksum check proves this exact binary came from
            # this repository's release workflow and nothing rewrote it in between.
            cosign verify-blob \
              --bundle "${dir}/SHA256SUMS.bundle" \
              --certificate-identity-regexp 'https://github.com/luiacuaniello/perspectivegraph/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${dir}/SHA256SUMS"
            # coreutils on Linux, the stock Perl shasum on macOS. Both accept this file
            # and --ignore-missing; only the name differs.
            if command -v sha256sum >/dev/null 2>&1; then
              ( cd "$dir" && sha256sum -c SHA256SUMS --ignore-missing )
            else
              ( cd "$dir" && shasum -a 256 -c SHA256SUMS --ignore-missing )
            fi
          else
            echo "::warning::signature verification is off, so this step executes an unverified download"
          fi

          tar -xzf "${dir}/${archive}" -C "$dir"
          chmod +x "${dir}/perspectivegraph"
        fi

        # Releases older than the gate do not merely lack the subcommand - they fall
        # through to starting the API server, bind a port, and sit there until the job's
        # own timeout kills it hours later with no verdict and no explanation. Catch that
        # here, in one line, rather than in someone's billing.
        # Captured rather than piped into grep: `gate -h` exits non-zero by design, and
        # under `pipefail` that makes the whole pipeline non-zero however the grep went -
        # which would reject every valid binary and break the action for everybody.
        #
        # Run in the background with a hand-rolled deadline rather than under `timeout`,
        # which does not exist on macOS - it was the second half of the same platform
        # bug: the probe died with "command not found", the output carried no flags, and
        # the action blamed the release.
        "${dir}/perspectivegraph" gate -h >"${dir}/probe.txt" 2>&1 &
        probe_pid=$!
        waited=0
        while [ "$waited" -lt 30 ] && kill -0 "$probe_pid" 2>/dev/null; do
          sleep 1
          waited=$((waited + 1))
        done
        if kill -0 "$probe_pid" 2>/dev/null; then
          # Still alive after 30s means it is not answering -h at all: an older release
          # that fell through to starting the API server.
          kill "$probe_pid" 2>/dev/null || true
        fi
        wait "$probe_pid" 2>/dev/null || true
        probe="$(cat "${dir}/probe.txt" 2>/dev/null || true)"
        case "$probe" in
          *-max-critical*) ;;
          *)
            if [ -n "$BINARY" ]; then
              echo "::error::the binary at '${BINARY}' has no usable 'gate' subcommand"
            else
              echo "::error::release ${VERSION} has no usable 'gate' subcommand. Pin a version that ships it."
            fi
            exit 1
            ;;
        esac

        echo "$dir" >> "$GITHUB_PATH"

    - name: Gate on attack paths
      id: gate
      shell: bash
      env:
        # Secrets travel in the environment rather than on the command line, where every
        # process on the runner can read them out of /proc.
        API_TOKEN: ${{ inputs.token }}
        INGEST_HMAC_SECRET: ${{ inputs.hmac-secret }}
        REPORT: ${{ inputs.report }}
        SOURCE: ${{ inputs.source }}
        REPORTS: ${{ inputs.reports }}
        MODE: ${{ inputs.mode }}
        API: ${{ inputs.api }}
        INGEST: ${{ inputs.ingest }}
        AWS_REGION_IN: ${{ inputs.aws-region }}
        AWS_ROLE: ${{ inputs.aws-role }}
        ESTATE: ${{ inputs.estate }}
        SLUG: ${{ inputs.slug }}
        SHA: ${{ inputs.sha }}
        PR: ${{ inputs.pr }}
        MAX_CRITICAL: ${{ inputs.max-critical }}
        TIMEOUT: ${{ inputs.timeout }}
        ALLOW_UNKNOWN: ${{ inputs.allow-unknown }}
      run: |
        # -e OFF, explicitly. GitHub runs composite bash steps as `bash -e -o pipefail`,
        # so a non-zero exit from the gate would abort this step at the line that produces
        # it - before the verdict is recorded and before the summary is written. The exit
        # code is the RESULT here, not a failure, so it has to be read rather than
        # inherited. Assuming -e was absent is what made blocked and unknown report
        # nothing at all.
        set +e
        set -uo pipefail

        # Only pass the flags we actually have. An empty -slug would override the
        # binary's own GITHUB_REPOSITORY fallback with nothing, and the gate would refuse
        # to run on the very event it is meant for.
        args=(gate -timeout "$TIMEOUT" -max-critical "$MAX_CRITICAL")
        [ -n "$SLUG" ] && args+=(-slug "$SLUG")
        [ -n "$SHA" ] && args+=(-sha "$SHA")
        [ -n "$PR" ] && [ "$PR" != "0" ] && args+=(-pr "$PR")
        [ -n "$REPORT" ] && args+=(-report "$REPORT" -source "$SOURCE")
        [ "$ALLOW_UNKNOWN" = "true" ] && args+=(-allow-unknown)

        if [ "$MODE" = "local" ]; then
          if [ -z "$AWS_REGION_IN" ] && [ -z "$ESTATE" ]; then
            echo "::error::local mode needs an estate: set aws-region (live, read-only) or estate. Without one there are no attack paths to reason about, only a flat list of findings."
            exit 1
          fi
          args+=(-local)
          [ -n "$AWS_REGION_IN" ] && args+=(-aws-region "$AWS_REGION_IN")
          [ -n "$AWS_ROLE" ] && args+=(-aws-role "$AWS_ROLE")
          [ -n "$ESTATE" ] && args+=(-estate "$ESTATE")
          # One source=path per line, so a workflow can list several scans readably.
          while IFS= read -r spec; do
            [ -n "$spec" ] && args+=(-reports "$spec")
          done <<< "$REPORTS"
        else
          if [ -z "$API" ]; then
            echo "::error::server mode needs the api input (or use mode: local, which needs no deployment)"
            exit 1
          fi
          if [ -n "$REPORT" ] && [ -z "$INGEST" ]; then
            echo "::error::a report was given but no ingest URL, so there is nowhere to send it"
            exit 1
          fi
          args+=(-api "$API")
          [ -n "$INGEST" ] && args+=(-ingest "$INGEST")
        fi

        # This is the line -e must not be allowed to abort (see the top of the step): the
        # code it returns has to be read and translated, so that "nobody analysed this"
        # reports differently from "this is dangerous". Collapsing those two is the exact
        # failure this gate exists to prevent.
        perspectivegraph "${args[@]}" -json > verdict.json
        code=$?

        # The verdict comes from the ANSWER, not from the exit code alone. With
        # allow-unknown the gate exits 0 on a commit nobody analysed - reading only the
        # code would publish verdict=clean for it, and anything downstream branching on
        # that output would be told the commit is safe. It was never looked at. The exit
        # code says what happens to the build; this says what is actually known.
        paths="$(jq -r '.criticalPaths // 0' verdict.json 2>/dev/null || echo 0)"
        analysed="$(jq -r '.analysed // false' verdict.json 2>/dev/null || echo false)"
        incomplete="$(jq -r '.incomplete // ""' verdict.json 2>/dev/null || echo "")"
        if [ "$code" -ge 3 ]; then
          verdict=error
        elif [ "$code" = "1" ]; then
          # A path found on partial data is still a real path, so blocked wins outright.
          verdict=blocked
        elif [ "$analysed" != "true" ] || [ -n "$incomplete" ] || [ "$code" = "2" ]; then
          # Three ways to not know: nothing carried the commit, the estate was read only
          # in part, or the gate said so itself. allow-unknown turns the exit code into 0
          # but must not turn the ANSWER into "clean" - reading only the code is how a
          # commit nobody looked at gets reported as safe.
          verdict=unknown
        else
          verdict=clean
        fi
        {
          echo "verdict=${verdict}"
          echo "critical-paths=${paths}"
          echo "exit-code=${code}"
        } >> "$GITHUB_OUTPUT"

        # Rendered once, into both the job log and the run summary: an engineer reading a
        # red build should not have to open an artifact to find out what it blocked on.
        {
          echo "## PerspectiveGraph attack-path gate"
          echo
          case "$verdict" in
            clean)
              echo "**Clean.** \`${SHA}\` was analysed. No critical attack path reaches a sensitive asset through it."
              ;;
            blocked)
              echo "**Blocked.** ${paths} critical attack path(s) run through \`${SHA}\`."
              echo
              echo '```'
              jq -r '.paths[]? | "[P" + (.priority | floor | tostring) + "] " + ([.nodes[].name] | join(" -> "))' verdict.json
              echo '```'
              ;;
            unknown)
              if [ -n "$incomplete" ]; then
                echo "**Unknown.** The estate was read only in part, so \"no attack path\" cannot be trusted -"
                echo "a route through the part that failed to read looks exactly like no route at all."
                echo
                echo '```'
                echo "$incomplete"
                echo '```'
              else
                echo "**Unknown.** Nothing carrying \`${SHA}\` reached the engine, so nobody analysed it."
                echo
                echo "This is not a clean result. Check that the scan ran, and that the ingest URL, the"
                echo "HMAC secret and the commit SHA are the ones this engine expects."
              fi
              if [ "$ALLOW_UNKNOWN" = "true" ]; then
                echo
                echo "**The build was passed anyway** because \`allow-unknown\` is set. This check is"
                echo "currently incapable of failing on an unanalysed commit."
              fi
              ;;
            *)
              echo "**Error.** The gate could not reach a verdict. See the step log."
              ;;
          esac
        } | tee -a "$GITHUB_STEP_SUMMARY"

        # This step always succeeds; the next one turns the verdict into a red check.
        # Failing here instead would abort the composite action, and GitHub does not
        # evaluate an action's outputs when the action fails - so the verdict would be
        # reported to nobody in exactly the cases worth reporting.
        exit 0

    # The decision lives in the shell rather than in a step-level `if:`, so that one
    # reading of the inputs applies everywhere: every other input this action acts on
    # arrives through `env:` too. It also keeps the step in the log with its reason,
    # instead of a silent `skipped`.
    - name: Fail the build
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
        SOFT: ${{ inputs.soft-fail }}
      run: |
        if [ "$SOFT" = "true" ]; then
          echo "::notice::soft-fail is set - reporting the verdict through the outputs rather than failing the build"
          exit 0
        fi
        # Empty means the gate never got far enough to record a verdict, which is not a
        # pass. Fail closed on 3 (error) rather than on bash's 255 for `exit ""`.
        exit "${CODE:-3}"
