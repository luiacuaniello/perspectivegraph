# Default nginx config baked into the dashboard image so it runs standalone
# (docker compose) with no external config. In Kubernetes the Helm chart mounts
# its own default.conf over this one (pointing /graphql at the backend Service).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the nginx version on errors/headers.
    server_tokens off;

    # Sensible baseline security headers for the SPA shell.
    #
    # NOTE for anyone adding a location{} below: nginx's add_header is REPLACED, not
    # merged, by any add_header on an inner level. A location that sets one of its own
    # silently drops every header here - which is what /assets/ used to do. Inner blocks
    # therefore repeat the set via the `security_headers` include-alike below.
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        DENY           always;
    add_header Referrer-Policy        same-origin    always;
    # The dashboard renders attack-path data - names, routes and evidence that come from
    # scanners and cloud APIs, i.e. from outside. CSP is what keeps a hostile string in
    # that data from becoming script, and what stops any script that does run from
    # phoning home.
    #
    # script-src carries a hash rather than 'unsafe-inline': index.html has exactly one
    # inline script, the theme applied before first paint to avoid a flash of light. The
    # hash is checked against index.html by scripts/csp-check.py in CI, so editing that
    # script without updating the header fails the build instead of the page.
    #
    # style-src needs 'unsafe-inline' - React writes element styles through the CSSOM and
    # the chart components set them per element. That is the standard, narrow concession;
    # script-src, which is the one that matters, stays strict.
    #
    # connect-src is 'self' because the SPA is served same-origin with the API proxied
    # through this nginx. A deployment that points the dashboard at a different API origin
    # must add it here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FiMaHP71FvIaDDWiCKLxBODudXjTZGEzi2huRD9YUUo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # GraphQL BFF + downloadable exports - proxied so the SPA stays same-origin.
    # `backend` is the compose service name; Helm overrides this whole file.
    location /graphql {
        proxy_pass         http://backend:8080/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /export/ {
        proxy_pass         http://backend:8080/export/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
    # Triage/suppression REST board (GET list, POST suppress, DELETE un-suppress).
    location /suppressions {
        proxy_pass         http://backend:8080/suppressions;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # Remediation ticketing REST board.
    location /tickets {
        proxy_pass         http://backend:8080/tickets;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # Red-team / BAS validation REST board.
    location /validations {
        proxy_pass         http://backend:8080/validations;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # Public auth config - the login gate reads it to learn the mode (token/OIDC)
    # and, for SSO, the IdP coordinates. Must be proxied or the SPA gets index.html.
    location /auth/config {
        proxy_pass         http://backend:8080/auth/config;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # AI-native assistant (summary / query / explain).
    location /ai/ {
        proxy_pass         http://backend:8080/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # Remediation-as-PR (open a fix PR for a path).
    location /remediation/ {
        proxy_pass         http://backend:8080/remediation/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashed static assets are immutable - cache them hard.
    location /assets/ {
        expires    1y;
        # Repeated, not inherited: the add_header below would otherwise replace the whole
        # server-level set and serve every script and stylesheet with no CSP and no
        # nosniff - the exact files where those headers matter most.
        add_header X-Content-Type-Options nosniff        always;
        add_header X-Frame-Options        DENY           always;
        add_header Referrer-Policy        same-origin    always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FiMaHP71FvIaDDWiCKLxBODudXjTZGEzi2huRD9YUUo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA routing: every unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
