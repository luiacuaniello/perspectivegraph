<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- One favicon for both themes: the mark sits on its own dark tile, so it reads the same on
         a light tab strip and a dark one, and matches the logo in the app (entry, hub, crown jewel). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='p' x1='11' y1='33' x2='37' y2='15' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%2353d0ef'/%3E%3Cstop offset='.55' stop-color='%236fbfae'/%3E%3Cstop offset='1' stop-color='%23e3a33a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1.5' y='1.5' width='45' height='45' rx='11' fill='%231c1b16' stroke='%2357523f' stroke-width='1.5'/%3E%3Cpath d='M11 33 L24 26 L37 15' fill='none' stroke='url%28%23p%29' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='11' cy='33' r='4.2' fill='%2353d0ef'/%3E%3Ccircle cx='24' cy='26' r='3.8' fill='%236fbfae'/%3E%3Cpath d='M37 7.5 L43.5 15 L37 23 L30.5 15 Z' fill='%23e3a33a'/%3E%3Ccircle cx='37' cy='15' r='2' fill='%23f5cd7e'/%3E%3C/svg%3E"
    />
    <title>PerspectiveGraph - DevSecOps Context Engine</title>
    <!-- Apply the saved/OS theme before first paint to avoid a flash of light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pg-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var r = document.documentElement;
          if (t === "dark") r.classList.add("dark");
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
