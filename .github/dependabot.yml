# Dependabot keeps dependencies patched across the ecosystems this repo uses.
# Grouped, weekly PRs so the review load stays low. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Go backend
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # INDIRECT dependencies too, which is not the default for gomod. A critical
    # advisory in a transitive module is exactly as shipped as one in a direct
    # dependency - it goes into the same binary - and with the default (direct only)
    # nothing proposes the bump: CVE-2026-56854 in golang.org/x/crypto sat at v0.53.0
    # until the image scan caught it, because no direct requirement mentioned it.
    allow:
      - dependency-type: all
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # React dashboard
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 compiles this project fine, but typescript-eslint's latest STABLE
      # declares `typescript: ">=4.8.4 <6.1.0"` and refuses to load under it - only
      # alphas go further, and an alpha does not belong in a security tool's lint gate.
      # Measured twice: once by hand, and again when a grouped bump carrying TS 7 turned
      # the Frontend job red. Without this rule the whole npm group is unmergeable every
      # week for one package. Drop it as soon as typescript-eslint ships stable TS 7
      # support - the rest of the group is worth having.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used in CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Grouped like the other two ecosystems, and for a reason this one learned the hard
    # way: ungrouped, every action bump is its own PR, and nearly all of them edit
    # .github/workflows/ci.yml. Five accumulated, each conflicting with the others, so
    # merging any one forced a rebase of the rest - and none was merged for 39 days.
    # On a security tool, a wall of stale-but-green dependency PRs is the first thing a
    # visitor sees and the hardest to argue with. One PR a week is reviewable; five that
    # fight over one file are not.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # Container images.
  #
  # This was the blind spot, and it was where every critical finding lived. Dependabot
  # watched the Go, npm and Actions ecosystems; the CI image scan covers only the two
  # images this project BUILDS. Nothing watched the third-party images the chart and the
  # compose file DEPLOY - so nats sat three minor versions behind on 2.12.11, carrying a
  # critical and ten highs that were all fixed upstream, and the Artifact Hub security
  # report was the first thing to say so.
  #
  # Coverage, stated honestly: the Dockerfiles below are certain. The chart's values.yaml
  # is picked up because its postgres and nats entries are plain `image: <ref>` strings,
  # which the docker parser deep-fetches from YAML; the first-party ones are
  # repository/tag maps and are skipped, correctly - release-please owns those. Whether
  # docker-compose.yml is fetched depends on the ecosystem's YAML matching, so it is
  # listed but not relied upon: check that a bump there actually arrives before trusting
  # it, and until then the compose pins are reviewed by hand alongside the chart.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/helm/perspectivegraph
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      chart-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-images:
        patterns: ["*"]
