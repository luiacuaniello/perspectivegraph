# OpenSSF Scorecard - an objective, automated audit of this repo's open-source
# security posture (branch protection, token permissions, pinned dependencies,
# dangerous workflows, etc.). Results appear under the Security tab and drive the
# Scorecard badge in the README.
#
# Note: the code-scanning upload requires the repository to be PUBLIC (or private
# with GitHub Advanced Security). Until this repo is public, this workflow will run
# but the final upload step is expected to no-op/fail - it activates on go-public.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          sarif_file: results.sarif
