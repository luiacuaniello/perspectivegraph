name: Action smoke test

# The gate's logic is unit-tested in Go. This tests the part that Go cannot reach: the
# published action as a consumer actually gets it - downloading the released binary,
# verifying its signature, putting it on PATH, assembling flags, and turning an exit code
# into a red or green check.
#
# None of that had ever run on a real runner before this workflow existed, and an action
# that fails the first time somebody adds it to their pipeline is worse than no action.
#
# It runs against a canned verdict server rather than a live engine on purpose: the point
# here is the wrapper, and a fixed answer makes "blocked must fail the build" an assertion
# instead of a hope.

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
  workflow_dispatch:

permissions: {}

jobs:
  verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: clean
            serve: clean
            allow_unknown: "false"
            soft_fail: "false"
            want_outcome: success
            want_verdict: clean
            want_paths: "0"

          # A red check must still SAY what it decided. The outputs are set on a failing
          # run too, so a later step can comment, open a ticket or annotate without having
          # to re-run anything - these cases exist to keep that true.
          - case: blocked-fails-the-build
            serve: blocked
            allow_unknown: "false"
            soft_fail: "false"
            want_outcome: failure
            want_verdict: blocked
            want_paths: "2"
          # The one that matters: a commit nobody analysed must go red, not green.
          - case: unknown-fails-closed
            serve: unknown
            allow_unknown: "false"
            soft_fail: "false"
            want_outcome: failure
            want_verdict: unknown
            want_paths: "0"

          # When an operator opts out, the build passes but the OUTPUT must still say
          # unknown - reporting "clean" for a commit nobody looked at is the lie this
          # whole tool exists to prevent, and it would be an easy one to introduce here.
          - case: unknown-allowed
            serve: unknown
            allow_unknown: "true"
            soft_fail: "false"
            want_outcome: success
            want_verdict: unknown
            want_paths: "0"

          # soft-fail changes only whether the build stops - the same verdict must come
          # back. These are the two cases that would otherwise have gone red.
          - case: blocked-reported-not-enforced
            serve: blocked
            allow_unknown: "false"
            soft_fail: "true"
            want_outcome: success
            want_verdict: blocked
            want_paths: "2"
          - case: unknown-reported-not-enforced
            serve: unknown
            allow_unknown: "false"
            soft_fail: "true"
            want_outcome: success
            want_verdict: unknown
            want_paths: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Serve a canned verdict
        env:
          SERVE: ${{ matrix.serve }}
        run: |
          set -euo pipefail
          cat > /tmp/verdict-server.py <<'PY'
          import json, os, sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          # analysedAt is far in the future so the freshness floor can never reject it.
          # This job never ingests, so no floor applies - but pinning it keeps the test
          # from depending on that fact staying true.
          VERDICTS = {
              "clean":   {"analysed": True,  "criticalPaths": 0, "paths": []},
              "unknown": {"analysed": False, "criticalPaths": 0, "paths": []},
              "blocked": {"analysed": True,  "criticalPaths": 2, "paths": [
                  {"id": "p1", "score": 0.72, "priority": 91.4,
                   "nodes": [{"name": "edge-alb", "label": "LoadBalancer"},
                             {"name": "payments-db", "label": "Database"}]},
                  {"id": "p2", "score": 0.31, "priority": 55.0,
                   "nodes": [{"name": "edge-alb", "label": "LoadBalancer"},
                             {"name": "admin-role", "label": "IAMRole"}]},
              ]},
          }
          V = dict(VERDICTS[os.environ["SERVE"]], analysedAt="2099-01-01T00:00:00Z")

          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  body = json.dumps({"data": {"prVerdict": V}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 8099), H).serve_forever()
          PY
          python3 /tmp/verdict-server.py &

          for _ in $(seq 1 30); do
            if curl -sf -X POST -d '{}' http://127.0.0.1:8099/graphql >/dev/null 2>&1; then
              echo "verdict server up, serving: ${SERVE}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the canned verdict server never came up"
          exit 1

      - name: Run the action
        id: gate
        continue-on-error: true
        uses: ./
        with:
          api: http://127.0.0.1:8099
          slug: acme/payments
          sha: abc123def456
          timeout: 30s
          allow-unknown: ${{ matrix.allow_unknown }}
          soft-fail: ${{ matrix.soft_fail }}

      - name: Assert
        env:
          GOT_OUTCOME: ${{ steps.gate.outcome }}
          GOT_VERDICT: ${{ steps.gate.outputs.verdict }}
          GOT_PATHS: ${{ steps.gate.outputs.critical-paths }}
          WANT_OUTCOME: ${{ matrix.want_outcome }}
          WANT_VERDICT: ${{ matrix.want_verdict }}
          WANT_PATHS: ${{ matrix.want_paths }}
        run: |
          set -uo pipefail
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::${1}: got '${2}', want '${3}'"
              fail=1
            else
              echo "ok  ${1} = ${2}"
            fi
          }
          check "build outcome" "$GOT_OUTCOME" "$WANT_OUTCOME"
          check "verdict output" "$GOT_VERDICT" "$WANT_VERDICT"
          check "critical-paths output" "$GOT_PATHS" "$WANT_PATHS"
          exit "$fail"

  # A release older than the gate does not merely lack the subcommand: it falls through to
  # starting the API server, binds a port, and sits there until the job's own timeout kills
  # it - hours later, with no verdict and no clue why. The action probes for that and must
  # refuse in seconds. v1.2.1 is the last release without the gate, so it stays a usable
  # fixture for as long as it exists.
  rejects-a-release-without-the-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - id: gate
        continue-on-error: true
        uses: ./
        with:
          api: http://127.0.0.1:8099
          version: v1.2.1
          slug: acme/payments
          sha: abc123def456
          timeout: 30s

      - name: Assert it refused rather than hanging
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the action accepted a release with no gate subcommand (outcome=${OUTCOME})"
            exit 1
          fi
          echo "ok  refused a release without the gate subcommand"

  # Local mode, which is the one that needs no deployment - and therefore the one most
  # people will actually reach for. It runs the real released binary against a committed
  # estate fixture and the repository's Trivy sample, so this exercises the whole chain a
  # consumer gets: download, verify, collect, ingest, pathfind, block.
  local-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum

      # Local mode is newer than the last release, so the released binary cannot run it.
      # Testing the action against a build of THIS commit is the only way a change to the
      # action is ever exercised before it ships - that is what the `binary` input is for.
      - name: Build the gate from this commit
        working-directory: ./backend
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "${RUNNER_TEMP}/pg-build"
          go build -o "${RUNNER_TEMP}/pg-build/perspectivegraph" ./cmd/perspectivegraph

      - id: gate
        continue-on-error: true
        uses: ./
        with:
          mode: local
          binary: ${{ runner.temp }}/pg-build/perspectivegraph
          estate: backend/testdata/gate-local-estate.json
          report: backend/testdata/trivy-sample.json
          source: trivy
          slug: acme/payments
          sha: abc123def456

      - name: Assert it blocked, and named the route
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          PATHS: ${{ steps.gate.outputs.critical-paths }}
        run: |
          set -uo pipefail
          fail=0
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome=${OUTCOME}, want failure"; fail=1; }
          [ "$VERDICT" = "blocked" ] || { echo "::error::verdict=${VERDICT}, want blocked"; fail=1; }
          [ "$PATHS" = "1" ] || { echo "::error::critical-paths=${PATHS}, want 1"; fail=1; }
          exit "$fail"

  # An estate is not optional. Without one there are no attack paths, only a flat list of
  # findings - which is the thing this engine exists to replace - so local mode must
  # refuse rather than return a verdict it cannot support.
  local-mode-refuses-without-an-estate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum

      # Local mode is newer than the last release, so the released binary cannot run it.
      # Testing the action against a build of THIS commit is the only way a change to the
      # action is ever exercised before it ships - that is what the `binary` input is for.
      - name: Build the gate from this commit
        working-directory: ./backend
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "${RUNNER_TEMP}/pg-build"
          go build -o "${RUNNER_TEMP}/pg-build/perspectivegraph" ./cmd/perspectivegraph

      - id: gate
        continue-on-error: true
        uses: ./
        with:
          mode: local
          binary: ${{ runner.temp }}/pg-build/perspectivegraph
          report: backend/testdata/trivy-sample.json
          slug: acme/payments
          sha: abc123def456

      - name: Assert it refused
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::local mode answered with no estate (outcome=${OUTCOME})"
            exit 1
          fi
          echo "ok  refused to answer without an estate"

  # macOS, and the only job that exercises the DOWNLOAD rather than the `binary` input:
  # picking the archive for the runner's OS, verifying it, and probing it without the
  # `timeout` command that does not exist there.
  #
  # It exists because the archive name used to be hardcoded to linux, so a macOS runner
  # fetched a Linux binary and then failed at the probe with "this release has no gate
  # subcommand" - blaming the release for a platform mismatch. Nothing in CI would have
  # noticed, because every other job runs on ubuntu.
  macos-runner:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Serve a canned verdict
        run: |
          set -euo pipefail
          cat > /tmp/verdict-server.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          V = {"analysed": True, "criticalPaths": 2, "analysedAt": "2099-01-01T00:00:00Z",
               "paths": [{"id": "p1", "score": 0.72, "priority": 91.4,
                          "nodes": [{"name": "edge-alb", "label": "LoadBalancer"},
                                    {"name": "payments-db", "label": "Database"}]},
                         {"id": "p2", "score": 0.31, "priority": 55.0,
                          "nodes": [{"name": "edge-alb", "label": "LoadBalancer"},
                                    {"name": "admin-role", "label": "IAMRole"}]}]}

          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  body = json.dumps({"data": {"prVerdict": V}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 8099), H).serve_forever()
          PY
          python3 /tmp/verdict-server.py &
          for _ in $(seq 1 30); do
            if curl -sf -X POST -d '{}' http://127.0.0.1:8099/graphql >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::the canned verdict server never came up"
          exit 1

      - id: gate
        continue-on-error: true
        uses: ./
        with:
          api: http://127.0.0.1:8099
          slug: acme/payments
          sha: abc123def456
          timeout: 30s

      - name: Assert the darwin binary ran and blocked
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          PATHS: ${{ steps.gate.outputs.critical-paths }}
        run: |
          set -uo pipefail
          fail=0
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome=${OUTCOME}, want failure"; fail=1; }
          [ "$VERDICT" = "blocked" ] || { echo "::error::verdict=${VERDICT}, want blocked"; fail=1; }
          [ "$PATHS" = "2" ] || { echo "::error::critical-paths=${PATHS}, want 2"; fail=1; }
          exit "$fail"
