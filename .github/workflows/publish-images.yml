name: Publish images

# Build, push, sign, and attest the release images. For each image it:
#   1. builds from its Dockerfile and pushes to GHCR (tag + latest),
#   2. signs it with cosign keyless (Sigstore, OIDC - no long-lived keys),
#   3. generates an SPDX SBOM (syft), attests it to the image, and attaches it to
#      the GitHub release,
#   4. attaches a SLSA build-provenance attestation.
#
# Called by the release workflow when release-please cuts a release (so it fires
# automatically without a PAT), and runnable by hand against any existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and sign (e.g. v0.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and sign (e.g. v0.3.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung build must cost minutes, not the 6-hour default. `npm ci` under QEMU/arm64
    # once died with SIGILL and left buildx waiting on a dead process for three hours,
    # which silently produced a release with no dashboard image. Both build stages are now
    # pinned to the native platform so this should not recur - but a ceiling turns the next
    # unknown hang into a visible failure instead of a slowly-rotting release.
    timeout-minutes: 30
    permissions:
      contents: write # attach SBOMs to the GitHub release
      packages: write # push images + signatures + attestations to GHCR
      id-token: write # cosign keyless + provenance (Sigstore OIDC)
      attestations: write # SLSA build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: perspectivegraph
          - name: dashboard
            context: ./frontend
            image: perspectivegraph-dashboard
          # The bundled demo database. It is published like the other two - signed, with
          # an SBOM and provenance - because the chart deploys it by default, and an
          # unsigned image in a chart whose other images are signed is the weakest link
          # deciding the guarantee. Rebuilding it every release is also what keeps it at
          # zero findings: the Dockerfile's `apk upgrade` only runs when something builds.
          - name: postgres
            context: ./deploy/postgres
            image: perspectivegraph-postgres
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      # Build from the tag, not from whatever branch this run was dispatched on. Without
      # the ref, a manual re-publish of an older tag builds what main holds today and
      # pushes it under that tag - and the SBOM and provenance attached below would then
      # describe a commit no consumer asked for. A version has to mean one thing.
      #
      # What this deliberately does NOT pin: workflow_dispatch always loads the workflow
      # definition from the branch you pick, so the steps come from that branch while the
      # source comes from the tag. So a fix to the build plumbing cannot be retrofitted
      # onto a tag that predates it. That is the intended trade: when a release build is
      # broken, cut a patch release rather than quietly changing what a tag builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag }}

      # QEMU emulates arm64 on the amd64 runner, so one job builds both platforms.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` has to mean the newest release, so it is moved only when the tag being
      # built IS the newest release - not merely because this job ran. Re-publishing an
      # older tag by hand is the whole reason workflow_dispatch exists, and with `latest`
      # applied unconditionally that repair would drag `latest` backwards: every `docker
      # pull` without a tag, including the one in the README's quickstart, would silently
      # land on an older image. Asking GitHub which release is newest gets all three cases
      # right - the automatic release, a repair of the current release, and a repair of an
      # old one - where keying off the trigger would get the middle case wrong.
      - id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # No argument means "the latest release", which the API defines as excluding
          # drafts and prereleases - so a prerelease correctly never claims `latest`.
          newest="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          if [ "${newest}" = "${TAG}" ]; then
            echo "${TAG} is the newest release: it will also be tagged latest"
            echo "is_newest=true" >>"${GITHUB_OUTPUT}"
          else
            echo "newest release is ${newest}, building ${TAG}: leaving latest alone"
            echo "is_newest=false" >>"${GITHUB_OUTPUT}"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_newest == 'true' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 as well as amd64: most engineers evaluating this are on Apple
          # Silicon, and an amd64-only image runs there under emulation - slow
          # enough to read as "this tool is slow" rather than "this is qemu".
          # arm64 servers (Graviton, Ampere) are the same story in production.
          #
          # Publishing for arm64 does NOT mean building under emulation. Both
          # Dockerfiles pin their build stage to $BUILDPLATFORM, so the compiler and
          # the Node toolchain run native and only the thin final stages (an `apk
          # upgrade`, a COPY) touch QEMU. That distinction is load-bearing: `npm ci`
          # emulated on arm64 died with SIGILL and left this job hung for three hours,
          # shipping a release with no dashboard image. Do not remove those
          # --platform flags to "simplify" the Dockerfiles.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # a portable SLSA attestation is attached below instead
          sbom: false # an SPDX SBOM is generated + attested below

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate the SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "sbom-${{ matrix.name }}.spdx.json" --clobber

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Prebuilt CLI binaries. The engine needs a deployment; `perspectivegraph redteam`
  # does not - it is one static, read-only binary that answers "which of my roles can
  # reach admin, according to AWS itself" in about thirty seconds. That only helps
  # someone if they do not first have to install Go and build it, so the release ships
  # the artifact rather than the instructions.
  #
  # Signed and attested exactly like the images: a downloaded binary that cannot be
  # verified would be the weakest link in a supply chain the rest of this pipeline
  # takes seriously.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the archives to the GitHub release
      id-token: write # cosign keyless (Sigstore OIDC)
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      # CGO off so each binary is static and runs on any host of its platform - no
      # glibc version to match, nothing to install alongside it.
      - name: Build every platform
        working-directory: ./backend
        env:
          CGO_ENABLED: "0"
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="perspectivegraph"; [ "$os" = "windows" ] && out="perspectivegraph.exe"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.releaseVersion=${TAG}" \
              -o "../dist/${out}" ./cmd/perspectivegraph
            # No version in the archive name, on purpose: it keeps
            # releases/latest/download/<name> a stable URL, so the one-line install in
            # the README never rots. The binary reports its own version.
            base="perspectivegraph_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd ../dist && zip -q "${base}.zip" "${out}" && rm "${out}")
            else
              (cd ../dist && tar -czf "${base}.tar.gz" "${out}" && rm "${out}")
            fi
          done
          # One checksum file over every archive: signing it signs all of them, and a
          # verifier needs one signature check rather than five.
          (cd ../dist && sha256sum * > SHA256SUMS)
          ls -l ../dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign v3 (installer v4) defaults to the Sigstore bundle format, which carries the
      # signature AND the certificate in one file. --output-signature/--output-certificate
      # are not merely deprecated there, they are IGNORED - so the old invocation asked it
      # to write a bundle to an unset path and died with `open : no such file or directory`
      # on an empty filename. Publishing one bundle is also the better artifact: a verifier
      # fetches one file instead of two that must be kept in step.
      # Published under two names. SHA256SUMS.sigstore.json is the one OpenSSF Scorecard's
      # Signed-Releases check recognises - it reads release assets by extension, and
      # scored every release 0 while this signature was attached only as .bundle.
      # SHA256SUMS.bundle stays, byte for byte the same file: the GitHub Action in this
      # repository fetches that name, from this release and from every earlier one.
      - name: Sign the checksums (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS
          cp dist/SHA256SUMS.bundle dist/SHA256SUMS.sigstore.json

      # Verify what was just produced, here, rather than trusting that it is verifiable.
      # This is the exact command the release notes hand to a user: if it cannot pass on
      # the runner that made the file, it will not pass for them either.
      - name: Verify the signature is usable
        run: |
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/perspectivegraph_*

      # The attestation above is stored in GitHub's attestation API, which
      # `gh attestation verify` reads but a release page does not show and Scorecard does
      # not look at. The same Sigstore bundle goes next to the archives as an in-toto
      # provenance file, so a downloaded binary can be checked with cosign alone and
      # offline - and every archive is verified against it first, with the command the
      # README gives users.
      - name: Publish the provenance with the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/perspectivegraph.intoto.jsonl
          for archive in dist/perspectivegraph_*; do
            cosign verify-blob-attestation \
              --bundle dist/perspectivegraph.intoto.jsonl --new-bundle-format \
              --type https://slsa.dev/provenance/v1 \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$archive"
          done

      - name: Attach the binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber

  # The Helm chart, published as an OCI artifact so a cluster can install it without
  # cloning this repository. Until this existed the chart shipped only as a path in a git
  # checkout: nothing to pin, nothing to verify, and no way to say "we run 1.8.0" in a
  # change record.
  #
  # Signed with cosign exactly like the images. A chart is a template for what runs with
  # cluster credentials, so an unverifiable one is a worse supply-chain hole than an
  # unverifiable image.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the packaged chart to the GitHub release
      packages: write # push to GHCR
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      # The chart carries its own version (release-please updates Chart.yaml), and the
      # tag being published carries another. If they disagree, someone published a chart
      # that claims a version nobody can correlate with a release - so stop here rather
      # than after it is in a registry and someone has installed it.
      - name: The chart version must be the release being published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          chart="$(helm show chart deploy/helm/perspectivegraph | awk '/^version:/{print $2}')"
          if [ "v${chart}" != "${TAG}" ]; then
            echo "::error::Chart.yaml is version ${chart} but the release is ${TAG}"
            exit 1
          fi
          echo "chart ${chart} matches ${TAG}"

      - name: Package
        run: helm package deploy/helm/perspectivegraph --destination dist

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `helm push` prints the digest it created; capture it, because signing a tag
      # signs whatever that tag points at later, while signing a digest signs this
      # artifact for good.
      #
      # A version is pushed ONCE. `helm package` stamps the current time into the archive,
      # so the same commit packaged twice is a different digest - and re-running this job
      # after a later step failed (it has: setup-oras hit a 504 from GitHub's release CDN
      # on v1.13.0, after the chart was already pushed and signed) would silently replace
      # the published, signed 1.13.0 with another build under the same tag. So ask the
      # registry first. 404: publish. 200: reuse what is there, and pull it, so the file
      # attached to the release is byte-for-byte the one in the registry. Anything else
      # stops the job - a registry that cannot say whether the version exists must not
      # be taken to mean that it does not.
      - id: push
        name: Push to GHCR (OCI), once per version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          name="${{ github.repository_owner }}/charts/perspectivegraph"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${name}:pull&service=ghcr.io" | jq -r .token)"
          code="$(curl -sS -o /dev/null -I -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${name}/manifests/${ver}")"
          case "$code" in
            404)
              helm push "dist/perspectivegraph-${ver}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
              ;;
            200)
              rm -f dist/*.tgz
              helm pull "oci://ghcr.io/${name}" --version "$ver" -d dist 2>&1 | tee push.log
              echo "::notice::chart ${ver} is already published; reusing it rather than pushing a new build over it"
              ;;
            *)
              echo "::error::GHCR answered ${code} for chart ${ver}; refusing to guess whether it is published"
              exit 1
              ;;
          esac
          digest="$(awk '/^Digest: /{print $2}' push.log)"
          test -n "$digest" || { echo "::error::helm printed no digest"; exit 1; }
          echo "ref=ghcr.io/${name}@${digest}" >>"${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the chart (cosign keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      # Verify here, with the command the docs hand to a user: if it cannot pass on the
      # runner that just produced the artifact, it will not pass for them either.
      - name: Verify the signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.push.outputs.ref }}" >/dev/null

      # Artifact Hub reads its metadata from the REGISTRY, not from git: an OCI repository
      # has no index to serve a file from, so a copy sitting in the tree reaches nobody.
      # Pushed on every release rather than once by hand, because the hand-pushed one is
      # the copy that silently falls behind - it carries the repositoryID that turns on
      # the Verified Publisher flag, and a stale one turns it back off.
      #
      # Pushed only when it differs. The file changes about once a year; the ORAS download
      # below comes from GitHub's release CDN, and on v1.13.0 that 504 failed a release
      # whose metadata in the registry was already identical. An OCI layer digest is the
      # sha256 of the file, so comparing digests is exact without fetching the blob.
      - id: ahmeta
        name: Is the Artifact Hub metadata in the registry current?
        run: |
          set -euo pipefail
          name="${{ github.repository_owner }}/charts/perspectivegraph"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${name}:pull&service=ghcr.io" | jq -r .token)"
          want="sha256:$(sha256sum artifacthub-repo.yml | cut -d' ' -f1)"
          manifest="$(mktemp)"
          code="$(curl -sS -o "$manifest" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${name}/manifests/artifacthub.io")"
          case "$code" in
            200) have="$(jq -r '.layers[0].digest' "$manifest")" ;;
            404) have="" ;;
            *)   echo "::error::GHCR answered ${code} for the artifacthub.io tag"; exit 1 ;;
          esac
          if [ "$have" = "$want" ]; then
            echo "artifacthub-repo.yml is already in the registry (${want})"
            echo "push=false" >>"${GITHUB_OUTPUT}"
          else
            echo "push=true" >>"${GITHUB_OUTPUT}"
          fi

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: steps.ahmeta.outputs.push == 'true'
      - name: Push the Artifact Hub repository metadata
        if: steps.ahmeta.outputs.push == 'true'
        run: |
          oras push "ghcr.io/${{ github.repository_owner }}/charts/perspectivegraph:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Attach the packaged chart to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.tgz --clobber

  # The floating major tag. `uses: owner/repo@v1` resolves v1 as a git ref, not as a
  # version: without a tag named exactly `v1` that line fails with "unable to find version
  # v1", and with it every consumer picks up patches without editing their workflow.
  #
  # It runs last, and that ordering is the point. The tag is a promise that everything
  # `uses: @v1` needs is there - so it may only move once the images are pushed AND the
  # binaries are attached, because the action downloads one of those binaries. Moving it
  # first would aim every consumer at a release whose artifacts do not exist yet.
  major-tag:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move the floating tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Move the floating major tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # A prerelease must never capture the tag that stable consumers follow.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::${TAG} is not a stable vX.Y.Z tag; leaving the floating tag alone"
              exit 0
              ;;
          esac

          major="${TAG%%.*}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$major" -m "${major} -> ${TAG}"
          git push -f origin "refs/tags/${major}"
          echo "::notice::${major} now points at ${TAG}"

  # The official MCP Registry (registry.modelcontextprotocol.io) lists the MCP server by the
  # backend image, which IS the server - `mcp` is a subcommand of the same binary. An entry
  # names one image tag, so a release that is not published there leaves every client that
  # installs from the registry on the previous image, security fixes included. The first
  # entry (1.13.3) was published by hand; this keeps it current.
  #
  # After `publish`, because the registry checks that the image it is given exists and
  # carries the io.modelcontextprotocol.server.name label the Dockerfile sets. Stable
  # releases only, like the floating tag.
  #
  # Re-runnable by construction, as the chart job is: the registry refuses a version it
  # already has, so the job asks first - 200 means published, skip; 404 means publish;
  # anything else stops rather than guessing.
  mcp-registry:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc: proves io.github.<owner>/... without a stored secret
    env:
      TAG: ${{ inputs.tag }}
      SERVER_NAME: io.github.luiacuaniello/perspectivegraph
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      # Pinned and checksum-verified like every other tool fetched at build time. The
      # sha256 is the digest GitHub records for the v1.8.1 release asset.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag }}

      - id: plan
        name: Is this release a stable version the registry does not have yet?
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} is not a stable vX.Y.Z tag; not publishing it to the MCP Registry"
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          version="${TAG#v}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${REGISTRY_URL}/v0.1/servers/${SERVER_NAME/\//%2F}/versions/${version}")"
          case "$code" in
            200)
              echo "::notice::${SERVER_NAME} ${version} is already in the MCP Registry"
              echo "publish=false" >>"${GITHUB_OUTPUT}"
              ;;
            404)
              echo "publish=true" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::the MCP Registry answered ${code} for ${SERVER_NAME} ${version}; refusing to guess whether it is published"
              exit 1
              ;;
          esac

      # -f matters here: without it a 504 from GitHub's release CDN is saved as the
      # download and only the checksum notices, which is how kind-action failed on v1.13.0.
      - name: Install mcp-publisher
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          bash scripts/mcp-server-json.sh "${TAG#v}" > server.json
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
          echo "::notice::published ${SERVER_NAME} ${TAG#v} to the MCP Registry"
