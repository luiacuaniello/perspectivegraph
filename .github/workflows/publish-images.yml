name: Publish images

# Build, push, sign, and attest the release images. For each image it:
#   1. builds from its Dockerfile and pushes to GHCR (tag + latest),
#   2. signs it with cosign keyless (Sigstore, OIDC - no long-lived keys),
#   3. generates an SPDX SBOM (syft), attests it to the image, and attaches it to
#      the GitHub release,
#   4. attaches a SLSA build-provenance attestation.
#
# Called by the release workflow when release-please cuts a release (so it fires
# automatically without a PAT), and runnable by hand against any existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and sign (e.g. v0.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and sign (e.g. v0.3.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung build must cost minutes, not the 6-hour default. `npm ci` under QEMU/arm64
    # once died with SIGILL and left buildx waiting on a dead process for three hours,
    # which silently produced a release with no dashboard image. Both build stages are now
    # pinned to the native platform so this should not recur - but a ceiling turns the next
    # unknown hang into a visible failure instead of a slowly-rotting release.
    timeout-minutes: 30
    permissions:
      contents: write # attach SBOMs to the GitHub release
      packages: write # push images + signatures + attestations to GHCR
      id-token: write # cosign keyless + provenance (Sigstore OIDC)
      attestations: write # SLSA build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: perspectivegraph
          - name: dashboard
            context: ./frontend
            image: perspectivegraph-dashboard
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      # Build from the tag, not from whatever branch this run was dispatched on. Without
      # the ref, a manual re-publish of an older tag builds what main holds today and
      # pushes it under that tag - and the SBOM and provenance attached below would then
      # describe a commit no consumer asked for. A version has to mean one thing.
      #
      # What this deliberately does NOT pin: workflow_dispatch always loads the workflow
      # definition from the branch you pick, so the steps come from that branch while the
      # source comes from the tag. So a fix to the build plumbing cannot be retrofitted
      # onto a tag that predates it. That is the intended trade: when a release build is
      # broken, cut a patch release rather than quietly changing what a tag builds.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      # QEMU emulates arm64 on the amd64 runner, so one job builds both platforms.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 as well as amd64: most engineers evaluating this are on Apple
          # Silicon, and an amd64-only image runs there under emulation - slow
          # enough to read as "this tool is slow" rather than "this is qemu".
          # arm64 servers (Graviton, Ampere) are the same story in production.
          #
          # Publishing for arm64 does NOT mean building under emulation. Both
          # Dockerfiles pin their build stage to $BUILDPLATFORM, so the compiler and
          # the Node toolchain run native and only the thin final stages (an `apk
          # upgrade`, a COPY) touch QEMU. That distinction is load-bearing: `npm ci`
          # emulated on arm64 died with SIGILL and left this job hung for three hours,
          # shipping a release with no dashboard image. Do not remove those
          # --platform flags to "simplify" the Dockerfiles.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # a portable SLSA attestation is attached below instead
          sbom: false # an SPDX SBOM is generated + attested below

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate the SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "sbom-${{ matrix.name }}.spdx.json" --clobber

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Prebuilt CLI binaries. The engine needs a deployment; `perspectivegraph redteam`
  # does not - it is one static, read-only binary that answers "which of my roles can
  # reach admin, according to AWS itself" in about thirty seconds. That only helps
  # someone if they do not first have to install Go and build it, so the release ships
  # the artifact rather than the instructions.
  #
  # Signed and attested exactly like the images: a downloaded binary that cannot be
  # verified would be the weakest link in a supply chain the rest of this pipeline
  # takes seriously.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the archives to the GitHub release
      id-token: write # cosign keyless (Sigstore OIDC)
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: backend/go.sum

      # CGO off so each binary is static and runs on any host of its platform - no
      # glibc version to match, nothing to install alongside it.
      - name: Build every platform
        working-directory: ./backend
        env:
          CGO_ENABLED: "0"
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="perspectivegraph"; [ "$os" = "windows" ] && out="perspectivegraph.exe"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.releaseVersion=${TAG}" \
              -o "../dist/${out}" ./cmd/perspectivegraph
            # No version in the archive name, on purpose: it keeps
            # releases/latest/download/<name> a stable URL, so the one-line install in
            # the README never rots. The binary reports its own version.
            base="perspectivegraph_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd ../dist && zip -q "${base}.zip" "${out}" && rm "${out}")
            else
              (cd ../dist && tar -czf "${base}.tar.gz" "${out}" && rm "${out}")
            fi
          done
          # One checksum file over every archive: signing it signs all of them, and a
          # verifier needs one signature check rather than five.
          (cd ../dist && sha256sum * > SHA256SUMS)
          ls -l ../dist

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the checksums (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/perspectivegraph_*

      - name: Attach the binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
