name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The parity tests read files OUTSIDE the Go module - .env.example, docker-compose,
      # the Helm values, these workflows, the Dockerfiles, the Makefile. Go's test cache
      # does not track those, so the step above can return a cached pass for a pull request
      # that changed only a deploy surface, and the guard silently does not run. Measured:
      # with .env.example deliberately broken, `go test ./internal/config/` still reports
      # `ok (cached)`; only -count=1 catches it. One package, so the cost is a second.
      - name: Repository-surface parity (uncached)
        run: go test -count=1 ./internal/config/
      # Supply-chain gate: fail on a vulnerability the code actually reaches.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # SAST gate: static security analysis of the tool's OWN source - a security
      # tool should hold itself to the bar it sets. The by-design benign hits
      # (G404 Monte-Carlo PRNG, G401/G505 sha1 as a non-crypto content fingerprint,
      # G304 operator-configured paths) now each carry a justified `// #nosec` at the
      # call site, so a plain `gosec ./...` is clean and NEW unjustified uses still
      # fail. Only G104 (unchecked cleanup Close() errors) stays globally excluded.
      - name: gosec (SAST)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude=G104 ./...
      # Correctness gate, orthogonal to the three above: vet catches a fixed set of
      # suspicious constructs, gosec looks for security patterns and govulncheck for
      # known-vulnerable dependencies - none of them find dead code, redundant
      # conditions or misused stdlib. staticcheck does, and on introduction it found a
      # real one: a body-size constant left unused while the literal it was meant to
      # name was written out twice, so changing the constant would have done nothing.
      # Pinned, not @latest, for the same reason Trivy is: `@latest` re-resolves on
      # every run, so the gate can change under a pull request that did not touch it.
      # It did exactly that - staticcheck 0.8 raised its floor to Go 1.26 and, with
      # GOTOOLCHAIN=local, the step failed to build the tool rather than the code. Bump
      # this deliberately, alongside the toolchain.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      # Catches an API token / private key accidentally committed - table stakes
      # for a repo whose whole job is finding exposures. Free for public repos &
      # personal accounts; orgs set GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  age-integration:
    name: AGE store integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      # Exercises the real, hand-written Cypher path (injection-sensitive) that
      # unit tests with the in-memory store can't cover.
      PERSPECTIVE_TEST_POSTGRES_DSN: "host=localhost port=5432 user=perspective password=perspective dbname=perspectivegraph sslmode=disable"
      # The governance stores and the migration runner skip themselves without a database,
      # so in the Backend job - which has none - every one of their tests is a silent skip:
      # six stores holding suppressions, tickets, history, verdicts, KEV holdout and the
      # audit chain, none of them exercised anywhere. Set at job level rather than on a
      # single step so the coverage gate below measures them too; otherwise their files
      # count as uncovered code that nothing ever ran.
      PERSPECTIVE_TEST_MIGRATE_DSN: "postgres://perspective:perspective@localhost:5432/perspectivegraph?sslmode=disable"
    services:
      postgres:
        image: apache/age:release_PG16_1.6.0@sha256:16aa423d20a31aed36a3313244bf7aa00731325862f20ed584510e381f2feaed
        env:
          POSTGRES_USER: perspective
          POSTGRES_PASSWORD: perspective
          POSTGRES_DB: perspectivegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perspective -d perspectivegraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum
      # The contract test creates the AGE extension + graph itself; just run it.
      # JetStream cannot be a service container: GitHub gives no way to pass the -js
      # argument, and without it the broker's streams do not exist. Started here instead,
      # from the same pinned digest the chart deploys.
      - name: Start NATS with JetStream
        run: |
          set -euo pipefail
          docker run -d --name nats -p 4222:4222 \
            nats:2.12.11-alpine@sha256:006a95e54643c0a2a33dfcee4654e9115f7540ebb8804822d3e2d82bf8515f61 -js
          for _ in $(seq 1 30); do
            if nc -z localhost 4222; then echo "nats up"; exit 0; fi
            sleep 1
          done
          echo "::error::NATS never accepted connections"
          exit 1

      - name: Run AGE store contract test
        run: go test -run TestAGEStoreContract -v ./internal/graph/...
      # Leader election's mutual-exclusion / failover needs a real Postgres
      # advisory lock; run it against the same service DB.
      - name: Run leader-election integration test
        run: go test -run TestAdvisoryLockMutualExclusion -v ./internal/leader/...
      # The coverage gate lives HERE, not in the Backend job, because it needs this
      # job's Postgres service: internal/graph/age is only exercised when the contract
      # test can reach a real AGE database, and measuring without it understates the
      # library coverage by several points and would fail the gate for the wrong reason.
      #
      # Two things the script does that a plain `go test -cover` does not, and both
      # change the number: it passes -coverpkg, so a package driven through an interface
      # by another package's test is credited (age reads 6.6% without it and is really
      # 67.6%), and it excludes cmd/ - main() plus the CLI subcommands, where a test
      # would assert the process starts rather than that anything works. cmd's own
      # number is printed for visibility, never enforced.
      # The delivery guarantees, against a real JetStream. They skip without one, so
      # before this step existed they had never run anywhere but a developer's laptop.
      - name: Run broker delivery integration tests
        working-directory: ./backend
        run: go test -run 'TestPublishedEventReachesTheHandler|TestFailedHandlerSeesTheEventAgain|TestMalformedMessageIsTerminatedNotRedelivered' -v -timeout 240s ./internal/broker/...

      # The governance stores, against a real database. Their failure modes are all
      # concurrency ones - two replicas forking the audit hash chain, a re-seal moving a
      # KEV grading date, a migration racing another replica's - so an in-memory stand-in
      # would assert nothing that matters. Run explicitly rather than left to the coverage
      # step so a failure here names the store that broke.
      - name: Run governance store integration tests
        run: |
          go test -count=1 ./internal/pgmigrate/... ./internal/audit/... ./internal/suppress/... \
            ./internal/ticket/... ./internal/history/... ./internal/validation/... ./internal/kevholdout/...

      - name: Coverage gate (libraries ≥ 80%)
        run: ../scripts/coverage-gate.sh 80

  # Nothing validated the Helm chart until now: not a lint, not a render. A template that
  # stopped parsing, or a workload that quietly lost its security context, would have
  # reached a user before anyone noticed.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Lint
        run: helm lint deploy/helm/perspectivegraph

      # --require-hashes, not just a version: a version alone still trusts whatever
      # PyPI serves under it. Every Action here is pinned to a SHA and every image to a
      # digest; this was the last install that was not.
      - run: python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci.txt

      # `restricted` is the Pod Security Standard most clusters this lands in enforce, and
      # a pod that misses one of its fields is refused admission rather than merely being
      # less hardened - so this is a compatibility gate as much as a security one. Both
      # value sets are checked: the demo defaults and the production overlay.
      - name: Admissible (restricted PSS) and self-healing (probes)
        run: |
          set -euo pipefail
          for values in "" "-f deploy/helm/perspectivegraph/values-production.yaml"; do
            # shellcheck disable=SC2086
            helm template pg deploy/helm/perspectivegraph $values \
              | python3 scripts/chart-check.py
          done

      # The CSP pins a hash of the one inline script in index.html, and two nginx configs
      # serve the same SPA - the image's and the chart's. Either drifting shows up as a
      # blank or unstyled dashboard in production and nowhere in the build, so check it
      # here rather than discover it there.
      - name: Content-Security-Policy matches the page it protects
        run: python3 scripts/csp-check.py

      # artifacthub-repo.yml is read by Artifact Hub, not by anything here, and a broken
      # one fails SILENTLY: the chart page keeps working and the ownership claim just
      # never succeeds, with no error anywhere to say why. It broke on its first hand
      # edit - an uncommented line left a leading space, which made the document
      # unparseable. Ten lines of check beat finding out from a flag that never turns on.
      # artifacthub.io/images REPLACES Artifact Hub's own image extraction, so whatever it
      # lists is exactly what gets scanned and reported beside the chart. An annotation
      # that falls behind the templates therefore does not go stale quietly - it publishes
      # a security report for a set of images nobody installs. Listing fewer than the chart
      # deploys is the failure that matters, and it is the flattering one.
      - name: Artifact Hub images match what a default install deploys
        run: |
          helm template pg deploy/helm/perspectivegraph > /tmp/rendered.yaml
          python3 - <<'PY'
          import re, sys, yaml
          chart = yaml.safe_load(open("deploy/helm/perspectivegraph/Chart.yaml"))
          declared = {i["image"] for i in yaml.safe_load(chart["annotations"]["artifacthub.io/images"])}
          rendered = set(re.findall(r'^\s*image:\s*"?([^"\s]+)"?\s*$', open("/tmp/rendered.yaml").read(), re.M))
          if declared != rendered:
              missing, extra = rendered - declared, declared - rendered
              if missing:
                  sys.exit(f"a default install deploys images the annotation does not declare, so they would not be scanned: {sorted(missing)}")
              sys.exit(f"the annotation declares images no default install deploys: {sorted(extra)}")
          print(f"artifacthub.io/images matches the rendered install: {len(declared)} image(s)")
          PY

      - name: Artifact Hub metadata is well-formed
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          d = yaml.safe_load(open("artifacthub-repo.yml"))
          if not isinstance(d, dict):
              sys.exit("artifacthub-repo.yml is not a YAML mapping")
          rid = str(d.get("repositoryID", ""))
          if not re.fullmatch(r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", rid):
              sys.exit(f"repositoryID {rid!r} is not the UUID Artifact Hub shows on the repository card")
          owners = d.get("owners") or []
          if not owners or not all(o.get("name") and "@" in str(o.get("email", "")) for o in owners):
              sys.exit("every owner needs a name and the email used to sign in to Artifact Hub")
          print(f"artifacthub-repo.yml ok: {rid}, {len(owners)} owner(s)")
          PY

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci`, never `npm install`: it installs exactly what the lockfile pins and
      # fails instead of resolving anything new, so CI tests the same dependency tree
      # the release image ships. It also means a pull request cannot silently pull in a
      # package that was never reviewed.
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - run: npm run build
      - name: Unit tests (Vitest)
        run: npm test
      # Supply-chain gate: fail on a high/critical advisory in the JS deps.
      #
      # Retried, because `npm audit` exits non-zero for two unrelated reasons - an advisory
      # was found, and the registry could not be reached - and npmjs.org has answered 503
      # twice on this repository in one day, on both the legacy and the current endpoint.
      # A retry is the whole fix: the gate still FAILS if the registry is genuinely down,
      # so a build never passes without having been audited. It just does not fail on a
      # blip. The two outcomes are told apart by the shape of the output rather than by
      # npm's error schema, which is theirs to change: a well-formed report is judged on
      # its counts, anything else is a failed attempt.
      - name: npm audit (high/critical)
        run: |
          set -uo pipefail
          for delay in 0 10 30; do
            if [ "$delay" -gt 0 ]; then
              echo "the registry did not return a report; retrying in ${delay}s"
              sleep "$delay"
            fi
            out="$(npm audit --json 2>/dev/null || true)"
            if printf '%s' "$out" | jq -e '.metadata.vulnerabilities.high' >/dev/null 2>&1; then
              n="$(printf '%s' "$out" | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')"
              if [ "$n" -gt 0 ]; then
                echo "::error::$n high/critical advisory(ies) in the npm dependency tree"
                npm audit --audit-level=high || true
                exit 1
              fi
              echo "npm audit: no high or critical advisories"
              exit 0
            fi
          done
          echo "::error::npm audit could not get a report from the registry after 3 attempts. The gate did not run, so this build fails rather than passing unaudited - re-run the job."
          exit 1

  # Dependency licences. An Apache-2.0 project that ships binaries and images has to
  # know what it is redistributing, and "we would have noticed" is not a control: a
  # transitive copyleft dependency arrives in a routine bump, not in a reviewed decision.
  #
  # The allowlist is deliberately narrower than "not obviously bad" - permissive only.
  # Anything else, MPL and the GPL family included, stops the build so a human decides
  # rather than a default. Measured against the current tree, which is Apache-2.0,
  # BSD-3-Clause and MIT on the Go side and MIT on the npm side.
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # SPDX ids. go-licenses wants commas, license-checker wants semicolons.
      ALLOWED_GO: "Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC"
      ALLOWED_NPM: "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum

      # --ignore our own module: its licence is this repository's (LICENSE lives at the
      # repo root, above the Go module), so the tool cannot find it and would report our
      # own packages as Unknown. Pinned, not @latest, for the reason the staticcheck step
      # gives a few jobs up.
      - name: Go dependencies
        working-directory: backend
        run: |
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --allowed_licenses="${ALLOWED_GO}" \
            --ignore github.com/luiacuaniello/perspectivegraph

      - name: Go inventory (for the log)
        working-directory: backend
        run: |
          go run github.com/google/go-licenses@v1.6.0 report ./cmd/perspectivegraph 2>/dev/null \
            | grep -v "^github.com/luiacuaniello/perspectivegraph" | sort -t, -k3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      # --production: devDependencies are not redistributed, so their licences are not a
      # distribution question. --excludePrivatePackages drops the dashboard's own package,
      # which is marked private and therefore reported UNLICENSED whatever its licence
      # field says - the same "our own code is not a third-party question" exemption.
      - name: npm dependencies
        working-directory: frontend
        run: |
          npx --yes license-checker-rseidelsohn@5.0.1 \
            --production --excludePrivatePackages \
            --onlyAllow "${ALLOWED_NPM}" --summary

  images:
    name: Container images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Build images
        run: |
          docker build -t perspectivegraph-backend:ci backend
          docker build -t perspectivegraph-dashboard:ci frontend
      # Installed from a SHA-pinned action rather than curling an install script off
      # a moving branch and piping it to a shell. The old form re-fetched whatever
      # `main` happened to contain at that moment and executed it in CI: a scanner
      # this repo trusts to gate its own releases was also the one dependency it
      # pulled unpinned. Everything else here is pinned; this now matches.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      # Fail on fixable HIGH/CRITICAL in the image layers (unfixable OS CVEs
      # don't block - there's nothing to do about them until a base rebuild).
      - name: Scan images
        run: |
          for img in perspectivegraph-backend:ci perspectivegraph-dashboard:ci; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done
