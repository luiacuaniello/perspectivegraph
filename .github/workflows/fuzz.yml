# Continuous fuzzing of the collector parse boundary - the self-hosted equivalent of
# OSS-Fuzz, with no external onboarding. The seed corpus already runs on every CI build
# (in the Go job); this explores each target deeper: weekly, on demand, and when the
# ingestion code changes. A discovered crasher fails the job and is uploaded as an
# artifact (Go writes it under testdata/fuzz/) so it can be committed as a regression seed.
name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 0" # weekly, Sunday
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzz duration per target (Go duration, e.g. 5m)
        default: "5m"
        type: string
  pull_request:
    paths:
      - "backend/internal/ingestion/**"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzCloudnet
          - FuzzIAM
          - FuzzK8s
          - FuzzTrivy
          - FuzzSemgrep
          - FuzzFalco
          - FuzzCustodian
          - FuzzSupplychain
          - FuzzSSO
          - FuzzDataclass
          - FuzzBuild
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"

      # Run through the wrapper rather than calling `go test -fuzz` directly. Go does not
      # distinguish "found something" from "the clock ran out" in its exit code: when
      # -fuzztime expires the run can exit non-zero with "context deadline exceeded"
      # (golang/go#72104), which turned this weekly job red for a target that had in fact
      # survived 2.6M executions without a finding. Verified: the same command, target and
      # Go version pass locally with 7.3M executions and a steady rate, while the CI run
      # showed the coordinator starving - long stretches of 0 execs/sec, then the counter
      # jumping six figures at once - on a runner where four workers compete with it.
      # The wrapper swallows ONLY a clean expiry with no reproducer on disk; a crash, a
      # seed-corpus failure, or anything it cannot explain still fails.
      - name: Fuzz ${{ matrix.target }}
        run: >
          scripts/fuzz-target.sh
          '${{ matrix.target }}'
          '${{ inputs.fuzztime || '3m' }}'

      - name: Upload crasher on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: backend/internal/ingestion/fuzz/testdata/fuzz/
          if-no-files-found: ignore
