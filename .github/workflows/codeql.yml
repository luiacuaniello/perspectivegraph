# CodeQL - GitHub's semantic static analysis. Deeper than gosec/govulncheck: it tracks
# data flow (taint) through the code to find injection, path traversal, SSRF, and similar.
# Free on public repositories; results land in the Security tab. Runs on PRs, on main, and
# weekly.
#
# Note: the SARIF upload needs the repository to be PUBLIC (or private with GitHub Advanced
# Security); until the repo is public this workflow runs but the upload step no-ops/fails.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          # The workflows themselves. They hold the tokens that sign and publish every
          # release, and CodeQL reads them for an event's text reaching a shell, untrusted
          # code checked out with write access, and artifacts trusted across runs.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Go)
        if: matrix.language == 'go'
        run: cd backend && go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          category: "/language:${{ matrix.language }}"
