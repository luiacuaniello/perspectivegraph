# Production secret handling for the Docker deployment.
#
# The base docker-compose.yml passes credentials as environment variables, which is the
# right trade for `make demo` - one command, nothing to prepare - and the wrong one for a
# real deployment. The process environment is close to public on a Unix host: anything
# that can read /proc/<pid>/environ sees it, `docker inspect` prints it in full to anyone
# in the docker group, it lands in crash dumps, and every child process inherits it.
#
# This overlay moves every credential into a mounted file instead. The backend reads each
# one through <KEY>_FILE, so the value never enters the environment at all - the same
# thing a Kubernetes Secret mounted as a volume does, and the same convention the postgres
# and mysql images established.
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml --profile app up -d
#
# Create the files first, with restrictive permissions, in a directory Docker can read:
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' "$(openssl rand -hex 32)" > secrets/postgres_password
#   printf '%s' "$(openssl rand -hex 32)" > secrets/ingest_hmac_secret
#   printf '%s' "tok-$(openssl rand -hex 16):admin" > secrets/api_tokens
#   printf '%s' "$(openssl rand -hex 32)" > secrets/store_encryption_key
#   chmod 600 secrets/*
#
# `secrets/` is gitignored. Use `printf` rather than `echo` to avoid a trailing newline -
# though the backend strips one anyway, because most secret managers add it.
#
# A file named here that cannot be read is a STARTUP FAILURE, not a fallback to the
# environment. That is deliberate: an operator who mistypes a path would otherwise get a
# clean start with no credential at all, which is precisely the open deployment they were
# using a mounted secret to avoid.
#
# Only the secrets you actually create need to be listed. Delete the entries you do not
# use - a `secrets:` block naming a file that does not exist stops compose from starting.

services:
  postgres:
    environment:
      # The official postgres image supports the same convention natively.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PASSWORD: ""
    secrets:
      - postgres_password

  backend:
    environment:
      # Each of these replaces the plain variable in the base file. The value is read
      # from the mounted path at startup and never appears in `docker inspect`.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      INGEST_HMAC_SECRET_FILE: /run/secrets/ingest_hmac_secret
      API_TOKENS_FILE: /run/secrets/api_tokens
      STORE_ENCRYPTION_KEY_FILE: /run/secrets/store_encryption_key
      # Blank out the environment-borne versions inherited from the base file, so a
      # value left over in a shell or a .env cannot quietly win.
      POSTGRES_PASSWORD: ""
      INGEST_HMAC_SECRET: ""
      API_TOKENS: ""
      STORE_ENCRYPTION_KEY: ""
      # Ingest and API auth are both configured above, so hold the process to it: with
      # PG_ENV=production the backend refuses to start if either is missing, rather than
      # serving this environment's attack map to whoever can reach the port.
      PG_ENV: ${PG_ENV:-production}
    secrets:
      - postgres_password
      - ingest_hmac_secret
      - api_tokens
      - store_encryption_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ingest_hmac_secret:
    file: ./secrets/ingest_hmac_secret
  api_tokens:
    file: ./secrets/api_tokens
  store_encryption_key:
    file: ./secrets/store_encryption_key
