# The broker of the single-VM recipe (docker-compose.vm.yml), the compose twin of the
# chart's: a stream on a volume, and every client authenticated.
port: 4222
http_port: 8222

# On a volume rather than nats-server's default, /tmp/nats/jetstream inside the container: a
# recreated container - every upgrade - lost whatever was queued there, and with it the
# record of which ingest batches had landed.
jetstream {
  store_dir: "/data"
}

# The credentials, generated by scripts/prod-init.sh into secrets/nats_auth.conf and
# mounted beside this file: an `authorization` block with the backend's user and password.
# Without one, anything that reaches port 4222 publishes events straight onto the bus - past
# the ingest endpoint's signature check - or deletes the stream.
include "auth.conf"
