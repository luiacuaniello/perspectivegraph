# Default values for the PerspectiveGraph chart.

backend:
  image:
    repository: ghcr.io/luiacuaniello/perspectivegraph
    # Empty means the chart's own appVersion, so a chart installs the app it was built
    # and tested against. It was `latest`, which floats: chart 1.12.0 could deploy any
    # image ever pushed, and Artifact Hub's security report scanned that instead of the
    # release. Set it to pin a different version - or better, to a @sha256 digest.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Scheduling. Empty by default - a single replica has nothing to spread - and set by
  # values-ha.yaml, because `replicas: 3` that the scheduler stacks on one node is three
  # copies of one failure domain rather than availability.
  topologySpreadConstraints: []
  affinity: {}
  tolerations: []
  # Requests/limits are REQUIRED for a production deployment. Left empty the pod is
  # BestEffort QoS: the kubelet evicts it first under node pressure, and an analyzer
  # pass over a large graph is exactly the memory spike that triggers that. Sized from
  # the measured curve in docs/SCALE.md (a 100k-node pass allocates ~350 MB).
  resources: {}
    # requests:
    #   cpu: 500m
    #   memory: 512Mi
    # limits:
    #   memory: 2Gi   # no cpu limit: throttling an analyzer pass only lengthens it
  # Deployment profile. "production" makes the backend refuse to start unless both
  # the API and ingest are authenticated; "demo" keeps the permissive default.
  env: demo
  logLevel: info
  # text (human) or json (log pipelines). Production should be json.
  logFormat: text
  # Left empty => the backend's own default applies. Listed here so every key the
  # backend reads is reachable from values.yaml (see the parity test).
  corsAllowedOrigins: ""
  # Move Prometheus /metrics off the API port, e.g. "127.0.0.1:9090". See
  # docs/OPERATIONS.md - the series carry a tenant label.
  metricsAddr: ""
  # Reverse proxies in front of the backend (CIDRs or addresses, comma-separated).
  # Empty = trust none: per-IP controls key on the peer and X-Forwarded-For is ignored.
  # An ingress DOES sit in front in this chart, so set it to the ingress controller's
  # pod CIDR if you want per-client rate limiting and lockout rather than per-ingress.
  # "on" | "off" | "" (follow the auth posture: on while open, off once authenticated).
  graphqlIntrospection: ""
  trustedProxyCidrs: ""
  authLockoutThreshold: ""
  exfilAlertThreshold: ""
  coverageStaleAfter: ""
  graphStrict: ""
  analyzerInterval: 30s
  # Scale knobs. analyzerWorkers bounds the per-seed pathfinding parallelism
  # (0 = auto = CPUs; the result is identical, it only trades CPU for pass
  # latency). analyzerIncremental keeps the graph resident and patches it with the
  # per-pass delta instead of re-reading it all each pass - the fetch-cost win on a
  # large AGE graph; off by default (trades memory for fetch cost).
  analyzerMaxHops: ""
  analyzerDbPaths: ""
  analyzerWorkers: 0
  analyzerIncremental: false
  # Attacker-profile mixture: the path score is also marginalized over a latent
  # attacker capability (commodity/criminal/apt) - Σ P(c)·∏ p(e|c) - for a per-profile
  # breakdown. Retune the threat-model priors (names match the built-ins; renormalized).
  # Empty keeps the defaults (commodity:0.5,criminal:0.35,apt:0.15).
  attackerProfilePriors: ""
  # EPSS -> conditional-traversal map: p(traverse|positioned) = EPSS^gamma. EPSS is a
  # marginal 30-day rate, not the conditional a positioned attacker needs; gamma < 1
  # lifts it (e.g. 0.5), empty or 1 keeps EPSS as-is (default). Opt-in, not auto-fitted.
  epssTraversalGamma: ""
  # Credential-origin threat model (opt-in). false (default) seeds paths only from internet
  # exposure; true also treats IAM users as seeds (their long-lived creds could leak), so
  # "if a credential leaks, what does it reach" surfaces alongside the internet-origin paths.
  seedIamUsers: false
  # In-pod TLS for the API + ingest servers (HTTPS >= 1.2 directly, no proxy
  # needed). Off by default - usually TLS terminates at the ingress instead. When
  # enabled, secretName must reference a kubernetes.io/tls Secret (tls.crt/tls.key);
  # the readiness probe then uses HTTPS.
  tls:
    enabled: false
    secretName: ""
  # Tiny utility image used by the dependency-wait initContainers (needs `nc`).
  # Pin to a digest in security-sensitive environments.
  # Pinned by digest like every other image this chart deploys, and like both
  # Dockerfiles. A tag is a pointer someone else can move; this is the one place the
  # chart still trusted one.
  waitImage: busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028

frontend:
  # nginx runs as uid 101 in its image. These are values rather than fixed template text
  # for the same reason the backend's are: a cluster that assigns its own UID range
  # (OpenShift) cannot accept a pinned runAsUser, and would refuse the pod outright.
  # fsGroup is what makes the emptyDirs below writable - nginx puts its pid in /var/run,
  # which the image leaves owned by root.
  #
  # Verified by running the image this way: uid 101, read-only rootfs, only /var/run and
  # /var/cache/nginx writable, serving on 8080.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  enabled: true
  image:
    repository: ghcr.io/luiacuaniello/perspectivegraph-dashboard
    tag: "" # empty = the chart's appVersion; see backend.image.tag above
    pullPolicy: IfNotPresent
  replicas: 1
  # As for the backend: empty until there is more than one replica to spread.
  topologySpreadConstraints: []
  affinity: {}

service:
  apiPort: 8080
  ingestPort: 8081
  frontendPort: 80

# In-cluster PostgreSQL + Apache AGE (graph core). To bring your own managed
# Postgres set enabled=false and point externalHost/externalPort at it - the
# instance must have the Apache AGE extension and the graph created (see
# deploy/postgres/init-age.sql). auth.* is used for the external instance too.
postgres:
  enabled: true
  # Full libpq DSN; when set it bypasses host/port/user/password/db/sslMode.
  dsn: ""
  externalHost: ""
  externalPort: 5432
  image: apache/age:release_PG17_1.7.0@sha256:92a5d223965bc2e436f9eee436e0bd2c0d81f3b59124b3d197ec94706f3450a8
  graph: perspective
  # libpq sslmode for the DB connection (it carries the attack map). Empty picks a
  # safe default by context: "disable" for the bundled in-cluster Postgres (no TLS),
  # "require" for a bring-your-own external DB. Set "verify-full" (and mount a CA via
  # POSTGRES_DSN/sslrootcert) for cert verification on a managed instance.
  sslMode: ""
  auth:
    user: perspective
    password: perspective
    database: perspectivegraph
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

# In-cluster NATS JetStream (event bus). To bring your own set enabled=false
# and point externalUrl at it (e.g. nats://my-nats.internal:4222, or tls://… with
# tls below). Most clusters get mesh-transparent mTLS instead and leave tls off.
nats:
  enabled: true
  externalUrl: ""
  image: nats:2.14.6-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3
  stream: PERSPECTIVE
  subject: perspective.events.*
  # App-level TLS to a TLS-enabled NATS (typically external; use a tls:// URL).
  # secretName references a Secret with ca.crt (+ tls.crt/tls.key for mutual TLS);
  # it's mounted and the backend trusts the CA / presents the client cert.
  tls:
    enabled: false
    secretName: ""

# Optional OpenSearch full-text index. Leave url empty to disable.
opensearch:
  url: ""

# Action layer: PR/MR commenters. Tokens go into a Secret; empty → dry-run.
# dashboardUrl is the public dashboard base the PR comment / merge-gate status
# links back to (e.g. https://perspectivegraph.example.com). Empty → no link.
# Repositories the engine may write to: PR comments, merge-gate commit statuses
# and remediation PRs, on GitHub and GitLab alike. Entries are "owner/repo" or
# "owner/*". REQUIRED for any real write - the destination otherwise comes from
# an ingested node property, so an empty list refuses every write.
repoAllowlist: []

github:
  token: ""
  apiUrl: https://api.github.com
  dryRun: false
  dashboardUrl: ""
gitlab:
  token: ""
  apiUrl: https://gitlab.com/api/v4
  dryRun: false

# Agentless connectors (PULL ingestion). enabled is a list, e.g. ["aws","azure"];
# empty ⇒ ingestion stays push-only. tenant tags pulled assets (multi-tenant
# installs). The AWS connector defaults to fixtures; mode "sdk" uses the AWS SDK
# (region + an assumable read-only roleArn via the pod's ambient credentials). The
# Azure connector maps normalized `az` state onto the cloudnet shape; fixtures
# default, "sdk" (azure-sdk-for-go) is the wired extension point.
connectors:
  enabled: []
  interval: 15m
  timeout: 2m
  tenant: ""
  aws:
    mode: fixtures
    fixturesDir: ""
    region: ""
    # One role ARN, or several comma-separated (one per account) to pull a
    # multi-account estate in one pass; each account's assets are qualified with
    # the account id AWS reports for its credentials.
    roleArn: ""
  azure:
    mode: fixtures
    fixturesDir: ""

# AI-native layer. apiKey (Anthropic/Claude) is the preferred backend and enables
# /ai/* (NL query, exec summary, path explain). hf.* is the free, OpenAI-compatible
# alternative (HuggingFace or any compatible endpoint), used only when apiKey is
# empty. With neither, the endpoints stay disabled (self-gated). apiKey + hf.token
# are secrets; the rest are optional overrides (sane defaults in-code).
ai:
  apiKey: ""
  model: ""
  baseUrl: ""
  maxTokens: ""
  hf:
    token: ""
    model: ""
    baseUrl: ""

# Data hygiene: redact secret-looking values out of scanner output before they
# reach the store. On by default; set false only if a feed is already clean.
scrubIngest: true

# At-rest encryption of the file-backed governance stores + detached signatures
# on graph exports. Both are secrets; empty ⇒ plaintext on disk / unsigned
# exports. Generate with e.g. --set crypto.storeEncryptionKey="$(openssl rand -hex 32)".
crypto:
  storeEncryptionKey: ""
  exportSigningKey: ""

# Remediation ticketing: dispatch each new ticket to an external tracker
# (Jira/GitHub/SOAR) over a webhook. Empty → local/dry-run (logged, tracked
# in-cluster). The URL is a secret (it can embed a token), so it lands in the Secret.
ticket:
  webhookUrl: ""

# ── Security & governance ───────────────────────────────────────────────────
# How the backend's credentials Secret is sourced. By default the chart creates it
# from the values below. To manage it externally (External Secrets / Sealed
# Secrets / Vault), set existingSecret to a Secret you provide carrying the same
# keys (POSTGRES_PASSWORD, API_TOKENS, INGEST_HMAC_SECRET, GITHUB_TOKEN,
# ANTHROPIC_API_KEY, HF_TOKEN, STORE_ENCRYPTION_KEY, EXPORT_SIGNING_KEY, …) - the
# chart then stops creating its own and the backend reads yours instead.
secrets:
  create: true
  existingSecret: ""

# A default install is UNAUTHENTICATED - acceptable only inside a trusted cluster
# for a demo. PerspectiveGraph is a map of how to attack the org, so for ANY
# deployment reachable beyond a trusted boundary set auth.apiTokens (and ideally
# ingest.hmacSecret + persistence for the audit log). These land in the Secret;
# an empty value means the control is OFF.
auth:
  # Bearer tokens → role[:tenant], comma-separated: "tok:viewer,tok2:admin:globex".
  # Empty ⇒ the read/write API is OPEN (no authentication). Generate with e.g.
  # --set auth.apiTokens="$(openssl rand -hex 16):admin".
  apiTokens: ""
  # Optional OIDC/JWT verification alongside (or instead of) static tokens.
  # Empty issuer ⇒ disabled. clientId/authorizeUrl/tokenUrl/scopes are the
  # SPA-facing coordinates the dashboard login gate reads from GET /auth/config to
  # run the Authorization-Code + PKCE flow; leave empty to keep the bearer-token
  # login. (issuer/audience/jwksUrl drive server-side token verification.)
  oidc:
    issuer: ""
    audience: ""
    jwksUrl: ""
    clientId: ""
    authorizeUrl: ""
    tokenUrl: ""
    scopes: "openid profile email"
    # IdP end-session endpoint → "Sign out" performs an RP-initiated logout.
    logoutUrl: ""
    # Directory groups → roles, e.g. "pg-viewers=viewer,pg-admins=admin". This is how
    # an SSO subject gets a role at all: enterprise IdPs keep authorisation in group
    # membership, and neither Okta nor Entra mints a "role" claim on its own - so
    # without a mapping (or defaultRole) people sign in successfully and see nothing.
    # A subject in several mapped groups gets the highest of them.
    groupRoles: ""
    # Grants a role to EVERY subject the IdP authenticates, including those in no
    # mapped group. Empty = no access without an explicit grant, which is the default
    # because signing in proves identity, not entitlement to a map of how to attack
    # the org. Set it when the IdP application is already restricted to the right
    # people; startup logs a warning either way.
    defaultRole: ""
    # Claim names, for directories that namespace them (Auth0, Entra). Empty keeps
    # role / groups / tenant / apps.
    roleClaim: ""
    groupsClaim: ""
    tenantClaim: ""
    appsClaim: ""
  # Per-client-IP rate limits (requests/sec). 0 ⇒ disabled.
  apiRateRps: 60
  ingestRateRps: 30

# Ingestion authenticity: HMAC secret(s) that scanners must sign webhook bodies
# with. Empty ⇒ ingestion accepts unsigned bodies (anyone who can reach the
# ingest port can forge scanner data). hmacSecrets is the per-tenant form
# ("tenant:secret,tenant2:secret2"). Both land in the Secret.
ingest:
  hmacSecret: ""
  hmacSecrets: ""

# Durable governance state. The suppression / ticket / red-team-validation /
# posture-history / audit-log stores are file-backed and single-writer; without a
# volume they are in-memory and reset on every pod restart (and the tamper-evident
# audit log never survives). Enabling this mounts a ReadWriteOnce PVC on the
# backend - which is why backend.replicas MUST stay 1 while it is on.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  mountPath: /data

# How long audit records are kept, e.g. "2160h" (90 days). Empty keeps them forever,
# which is the absence of a retention policy rather than one - set it deliberately.
# It prunes only with governanceBackend "postgres", where the oldest records can be
# removed and checkpointed so the rest still verifies; on the file backend the log is
# rotated instead (stop, move aside, start - see docs/OPERATIONS.md).
auditRetention: ""

# Voluntary-disruption budget for the backend (and the frontend when it too runs more
# than one replica). Off by default: on a single replica a budget can only either do
# nothing or block node drains forever, so the chart refuses that combination rather
# than letting a drain hang at 3am. values-ha.yaml turns it on.
disruptionBudget:
  enabled: false
  minAvailable: 1

# Pod security context for the backend. The distroless image runs as the nonroot
# user 65532; fsGroup makes a freshly-provisioned persistence PVC group-writable by
# it (without it, the volume is root-owned and the first verdict/ticket/suppression
# write fails - the reason persistence.enabled looked "durable" but silently broke).
# runAsNonRoot pins the guarantee. Tune uid/gid to your cluster's PodSecurity policy.
# Where triage decisions (suppressions) live.
#
#   file     - on the persistence PVC. One writer, so backend.replicas must stay 1 while
#              persistence is on; the chart refuses to render otherwise.
#   postgres - in POSTGRES_DSN, shared by every replica, and the audit chain moves there
#              with them (appends serialise on an advisory lock, so replicas share one
#              chain instead of forking it). The schema is created and upgraded on
#              startup, under an advisory lock so several replicas starting together
#              cannot collide. This is what lifts the single-replica ceiling - set
#              persistence.enabled: false alongside it, since the PVC then holds nothing
#              and its ReadWriteOnce mode would still pin the pods to one node.
governanceBackend: file

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # Required by the `restricted` Pod Security Standard. Everything else here already
  # satisfied it; without this one field an enforcing namespace still refuses the pod -
  # so the backend was hardened in every respect except the one that decides admission.
  seccompProfile:
    type: RuntimeDefault
# Container security context: match the compose hardening (drop all caps, no
# privilege escalation, read-only rootfs). /tmp is an emptyDir so the read-only
# rootfs still has scratch space. Set to {} to opt out on a constrained runtime.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Graph staleness pruning (GRAPH_TTL): drop nodes/edges not re-observed within
# this window so assets that left the source feeds stop generating phantom attack
# paths. Empty ⇒ disabled. Example: "168h" (7 days).
graph:
  ttl: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: perspectivegraph.local
  # TLS termination at the ingress (recommended way to serve HTTPS). Set
  # tls.enabled and a secretName holding the cert - typically issued automatically
  # by cert-manager: add its issuer to annotations, e.g.
  #   annotations: { cert-manager.io/cluster-issuer: letsencrypt-prod }
  # and cert-manager fills secretName for you. host defaults to ingress.host.
  tls:
    enabled: false
    secretName: perspectivegraph-tls
    host: ""

# Threat intel (CISA KEV + FIRST EPSS). Empty => the backend's defaults.
threatIntel:
  enabled: ""
  kevFeedUrl: ""
  epssApiUrl: ""

# KEV holdout calibration. Needs threatIntel and a path that survives restarts.
kevHoldout:
  enabled: ""
  path: ""
  window: ""

# Drift alerting webhook.
alert:
  webhookUrl: ""
  webhookFormat: ""
