apiVersion: v2
name: perspectivegraph
description: PerspectiveGraph - The Open DevSecOps Context Engine
type: application
version: 1.12.2 # x-release-please-version
appVersion: "1.12.2" # x-release-please-version
# The floor is policy/v1 PodDisruptionBudget, which went GA in 1.21; everything else
# here (networking.k8s.io/v1, seccompProfile, topologySpreadConstraints) is older.
#
# The `-0` is not decoration, and which Helm you run decides whether it matters.
# Managed distributions report versions like "v1.21.0-eks-1234", which SemVer reads as
# a PRE-RELEASE of 1.21.0. Measured against both:
#
#   helm 3.16.4  ">= 1.21.0"    vs v1.21.0-eks-1234  ->  REFUSED
#   helm 3.16.4  ">= 1.21.0-0"  vs v1.21.0-eks-1234  ->  accepted
#   helm 4.2.2   either                              ->  accepted
#
# So without the suffix the chart installs on kind and refuses on EKS for anyone still
# on Helm 3 - which is what this repository's own CI pins. Keep it.
kubeVersion: ">= 1.21.0-0"
icon: https://raw.githubusercontent.com/luiacuaniello/perspectivegraph/main/docs/logo.svg
keywords:
  - security
  - devsecops
  - attack-paths
  - graph
home: https://github.com/luiacuaniello/perspectivegraph
sources:
  - https://github.com/luiacuaniello/perspectivegraph
maintainers:
  - name: PerspectiveGraph contributors
# Artifact Hub reads these to build the chart's page - the one thing an OCI registry
# cannot give it. `images` is the load-bearing one: it is what Artifact Hub scans to
# publish the security report beside the chart.
#
# It lists EVERY image a default install deploys, third-party ones included, because the
# annotation REPLACES Artifact Hub's own extraction: listing only the two we build would
# have taken the report from 20 criticals to zero without fixing anything - the bundled
# apache/age is where most of them are. A security tool that quietly drops the images
# making its own badge look bad has answered the wrong question. `values-production.yaml`
# is the honest fix and already does it: it points at an external Postgres, and apache/age
# is not deployed at all.
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: backend
      image: ghcr.io/luiacuaniello/perspectivegraph:v1.12.2 # x-release-please-version
    - name: dashboard
      image: ghcr.io/luiacuaniello/perspectivegraph-dashboard:v1.12.2 # x-release-please-version
    - name: postgres-age
      image: apache/age:release_PG16_1.6.0@sha256:16aa423d20a31aed36a3313244bf7aa00731325862f20ed584510e381f2feaed
    - name: nats
      image: nats:2.12.11-alpine@sha256:006a95e54643c0a2a33dfcee4654e9115f7540ebb8804822d3e2d82bf8515f61
    - name: governance-init
      image: busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/luiacuaniello/perspectivegraph/blob/main/docs/MANUAL.md
    - name: Threat model
      url: https://github.com/luiacuaniello/perspectivegraph/blob/main/docs/THREAT-MODEL.md
    - name: Operations runbook
      url: https://github.com/luiacuaniello/perspectivegraph/blob/main/docs/OPERATIONS.md
    - name: Support policy
      url: https://github.com/luiacuaniello/perspectivegraph/blob/main/SUPPORT.md
    - name: Upgrade notes
      url: https://github.com/luiacuaniello/perspectivegraph/blob/main/docs/UPGRADING.md
