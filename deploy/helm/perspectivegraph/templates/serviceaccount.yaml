{{- if .Values.serviceAccount.create }}
{{- /*
  The backend's identity in the cluster, kept apart from the namespace's default so that a
  cloud role bound to it reaches the backend and nothing else. On EKS that is how the AWS
  connector is given its read-only role: an EKS Pod Identity association names this
  service account, or IRSA annotates it (serviceAccount.annotations).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "perspectivegraph.serviceAccountName" . }}
  labels:
    {{- include "perspectivegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
