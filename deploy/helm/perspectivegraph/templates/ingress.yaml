{{- if .Values.ingress.enabled }}
{{- /*
  Enabling the ingress is the moment this install becomes reachable, and this ingress
  routes BOTH /graphql (the attack map) and /ingest (the write side). The backend already
  refuses to start unauthenticated when PG_ENV=production, but that gate only fires for an
  operator who declared production - so an install left on the demo default was reachable
  and open, with nothing but a startup warning that scrolls past.
  This fires at the one moment the chart can be certain exposure is intended. The same
  condition guards service.type in backend.yaml, through a shared helper, because it is the
  same exposure by another route. It cannot see inside secrets.existingSecret, so an
  operator supplying credentials that way is trusted rather than blocked.
*/}}
{{- if not (include "perspectivegraph.credentialsConfigured" .) }}
{{- fail "ingress.enabled publishes /graphql, this environment's map of how to breach it, and /ingest, which lets anyone forge what the engine reasons over - and no credential is configured. Set auth.apiTokens (static bearer tokens) or auth.oidc.jwksUrl with issuer and audience (SSO), and ingest.hmacSecret (or ingest.hmacSecrets for per-tenant keys); or supply them through secrets.existingSecret. If an open instance is what you actually want - a public read-only demo, say - set ingress.allowUnauthenticated: true and be explicit about it." -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "perspectivegraph.fullname" . }}
  labels:
    {{- include "perspectivegraph.labels" . | nindent 4 }}
  annotations:
    {{- /*
      /ingest and /gate take scanner reports, which the backend accepts up to 32 MiB. The
      nginx-based controllers refuse a body over 1 MiB by default, with a 413 the engine never
      sees - so a real report was lost at the ingress. ingress.maxBodySize raises it for
      both of them (ingress-nginx and F5 NGINX); other controllers ignore these keys. An
      annotation the operator set wins.
    */}}
    {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
    {{- with .Values.ingress.maxBodySize }}
    {{- range $key := list "nginx.ingress.kubernetes.io/proxy-body-size" "nginx.org/client-max-body-size" }}
    {{- if not (hasKey $annotations $key) }}
    {{- $_ := set $annotations $key (toString $.Values.ingress.maxBodySize) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  # TLS termination at the ingress. Provide a cert in `secretName` (e.g. issued by
  # cert-manager via an annotation in ingress.annotations), or set ingress.tls.host
  # to override the host the cert covers.
  tls:
    - hosts:
        - {{ .Values.ingress.tls.host | default .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Ingestion webhooks (CI posts scanner output here).
          - path: /ingest
            pathType: Prefix
            backend:
              service:
                name: {{ include "perspectivegraph.backendHost" . }}
                port:
                  number: {{ .Values.service.ingestPort }}
          # GraphQL API.
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: {{ include "perspectivegraph.backendHost" . }}
                port:
                  number: {{ .Values.service.apiPort }}
          # The merge gate's comparison (POST /gate/impact) - an API route, authenticated
          # like /graphql. Its body is a scanner report, like /ingest's: see maxBodySize.
          - path: /gate
            pathType: Prefix
            backend:
              service:
                name: {{ include "perspectivegraph.backendHost" . }}
                port:
                  number: {{ .Values.service.apiPort }}
          {{- if .Values.frontend.enabled }}
          # Dashboard (catch-all).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "perspectivegraph.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
          {{- end }}
{{- end }}
