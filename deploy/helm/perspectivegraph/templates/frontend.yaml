{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perspectivegraph.fullname" . }}-frontend-nginx
  labels:
    {{- include "perspectivegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Probed by kubelet several times a minute: answered from memory, so it never reads
      # the SPA off disk and never fills the access log. It says only "nginx is
      # answering" - deliberately NOT whether the backend is up, because a dashboard that
      # removes itself from the Service when the API is down leaves the operator without
      # the page on which to read that the API is down.
      location = /healthz {
        access_log off;
        # default_type, not add_header: for a response generated by `return` the type
        # comes from the content handler, so add_header never reaches it.
        default_type text/plain;
        return 200 "ok\n";
      }

      location /graphql {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/graphql;
        proxy_set_header Host $host;
      }
      location /export/ {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/export/;
        proxy_set_header Host $host;
      }
      location /suppressions {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/suppressions;
        proxy_set_header Host $host;
      }
      location /tickets {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/tickets;
        proxy_set_header Host $host;
      }
      location /validations {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/validations;
        proxy_set_header Host $host;
      }
      location /auth/config {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/auth/config;
        proxy_set_header Host $host;
      }
      location /ai/ {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/ai/;
        proxy_set_header Host $host;
      }
      location /remediation/ {
        proxy_pass http://{{ include "perspectivegraph.backendHost" . }}:{{ .Values.service.apiPort }}/remediation/;
        proxy_set_header Host $host;
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perspectivegraph.fullname" . }}-frontend
  labels:
    {{- include "perspectivegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      # Pod Security Standards `restricted` refuses a pod without these, and a cluster
      # enforcing it is common wherever this would be deployed - so without them the
      # dashboard is not merely unhardened, it is unschedulable. fsGroup is what makes the
      # emptyDir below writable: nginx runs as uid 101, and its pid file lives in
      # /var/run, which the image leaves owned by root.
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with .Values.frontend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          # Liveness answers a different question from readiness - "is this process
          # wedged" - so it gets its own budget, and it depends on nothing but nginx: a
          # backend outage must never restart the dashboard in a loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # As uid 101 nginx can write neither its pid nor its cache into the image's
            # own directories, so both are emptyDirs the fsGroup owns.
            - name: run
              mountPath: /var/run
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "perspectivegraph.fullname" . }}-frontend-nginx
        - name: run
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perspectivegraph.fullname" . }}-frontend
  labels:
    {{- include "perspectivegraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 8080
{{- end }}
